<script>
/* Safari / mobile boot watchdog: never leave an unexplained empty root. */
(function () {
  var errors = [];
  window.__W2_BOOT_ERRORS = errors;
  function remember(kind, value, source) {
    errors.push({ kind: kind, value: String(value || ""), source: String(source || "") });
  }
  window.addEventListener("error", function (event) {
    var target = event.target || {};
    remember("error", event.message || "resource-load-failed", event.filename || target.src || target.href);
  }, true);
  window.addEventListener("unhandledrejection", function (event) {
    var reason = event.reason;
    remember("promise", reason && reason.message ? reason.message : reason, "");
  });
  window.addEventListener("DOMContentLoaded", function () {
    window.setTimeout(function () {
      var root = document.getElementById("root");
      if (!root || root.childElementCount || String(root.textContent || "").trim()) return;
      var panel = document.createElement("main");
      panel.setAttribute("role", "alert");
      panel.style.cssText = "position:relative;z-index:5;max-width:560px;margin:18vh auto 0;padding:28px;border:2px solid #141414;background:#FCFBF7;color:#141414;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;box-shadow:10px 10px 0 rgba(20,20,20,.1)";

      var actions = panel.querySelector("#w2-recovery-actions");
      var retry = document.createElement("button");
      retry.type = "button";
      retry.textContent = "重新载入";
      retry.style.cssText = "height:40px;padding:0 18px;border:1px solid #141414;background:#141414;color:#F5F2EB;font-weight:700";
      retry.addEventListener("click", function () { window.location.reload(); });
      actions.appendChild(retry);
      root.appendChild(panel);
      if (window.console && console.error) console.error("WAREHOUSE OS 2.1 boot failed", errors);
    }, 12000);
  });
})();
</script>

<script>
/* 深色是公司級旗標，可安全預載以避免重載閃白；個人 accent/ink 絕不在此讀取。 */
try {
  const token = localStorage.getItem("warehouse_auth_token") || "";
  const tenant = localStorage.getItem("warehouse_current_tenant") || "";
  const flags = token && tenant
    ? JSON.parse(localStorage.getItem("warehouse_runtime_flags:" + encodeURIComponent(tenant)) || "null")
    : null;
  if (flags && flags.dark) document.documentElement.dataset.w2Theme = "dark";
} catch (e) {}
</script>

    var link = document.createElement("link");

    link.href = href;

  }
  function script(src, done) {
    var node = document.createElement("script");
    node.src = src;
    node.async = true;
    if (done) node.addEventListener("load", done, { once: true });
    document.head.appendChild(node);
