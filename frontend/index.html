<!-- API 端點:本機開發(127.0.0.1/localhost)指向後端 8090;部署到服務器後同源,
     base 留空,前端 fetch("/api/...") 由 Nginx 反代到內網 8090。改地址只需改這一處。 -->
<script>
  window.WAREHOUSE_API_BASE =
    (location.hostname === "127.0.0.1" || location.hostname === "localhost")
      ? "http://127.0.0.1:8090"
      : "";
</script>
