services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18
    environment:
      POSTGRES_DB: warehouse_os
      POSTGRES_USER: warehouse_admin
      POSTGRES_PASSWORD: local-only-change-me
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_os -d warehouse_os"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # The running API never needs migration credentials.
      WAREHOUSE_MIGRATION_DATABASE_URL: ""
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
