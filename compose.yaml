services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18
    environment:
      POSTGRES_DB: warehouse_os
      POSTGRES_USER: warehouse_admin
      POSTGRES_PASSWORD: local-only-change-me
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_admin -d warehouse_os"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse_os:local-only-change-me@postgres:5432/warehouse_os
      WAREHOUSE_MIGRATION_DATABASE_URL: postgresql+psycopg://warehouse_migrator:local-only-migration-change-me@postgres:5432/warehouse_os
      WAREHOUSE_CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080 --proxy-headers
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
