name: Warehouse tunnel origin diagnostics

on:
  push:
    branches:
      - chatgpt/current-production-probe
    paths:
      - .github/workflows/current-production-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 10
    steps:
      - name: Inspect cloudflared origin without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo '=== cloudflared command (redacted) ==='
          docker inspect warehouse-cloudflared --format '{{json .Config.Cmd}}' \
            | sed -E 's/(token[^" ]*[=:]?)[^" ]+/\1REDACTED/Ig; s/(eyJ[A-Za-z0-9._-]{20,})/REDACTED/g' || true
          echo '=== cloudflared mounts ==='
          docker inspect warehouse-cloudflared --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}' || true
          echo '=== cloudflared recent origin errors ==='
          docker logs --tail 120 warehouse-cloudflared 2>&1 \
            | sed -E 's/(token[^ ]*[=:]?)[^ ]+/\1REDACTED/Ig; s/(eyJ[A-Za-z0-9._-]{20,})/REDACTED/g' \
            | grep -Ei 'origin|service|connect|error|http_status|url' \
            | tail -80 || true
          echo '=== docker networks ==='
          docker inspect warehouse-cloudflared --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k $v.IPAddress}}{{end}}' || true
