name: Current production probe

on:
  pull_request:
    paths:
      - .github/workflows/current-production-probe.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clear diagnostic Backend contract backlog
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel.txt
          for branch in chatgpt/current-production-probe chatgpt/verify-registry-production; do
            encoded="$(python3 - "$branch" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=''))
          PY
          )"
            curl -fsS "${auth[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/backend-contract.yml/runs?branch=${encoded}&event=pull_request&per_page=100" \
              > /tmp/runs.json
            python3 - <<'PY' >> /tmp/cancel.txt
          import json
          for r in json.load(open('/tmp/runs.json')).get('workflow_runs', []):
              if r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          done
          echo 32642089280 >> /tmp/cancel.txt
          sort -u /tmp/cancel.txt -o /tmp/cancel.txt
          while read -r id; do
            [ -n "$id" ] || continue
            code="$(curl -sS -o /tmp/cancel-response.json -w '%{http_code}' -X POST \
              "${auth[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" || true)"
            echo "cancel run=${id} http=${code}"
          done < /tmp/cancel.txt

      - name: Inspect integrated production deploy run
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${auth[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/32642210456" \
            > /tmp/production.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/production.json'))
          print(json.dumps({k:r.get(k) for k in ['id','status','conclusion','event','head_branch','head_sha','run_number','created_at','updated_at','html_url']}, ensure_ascii=False))
          PY

      - name: Read current public production identity
        shell: bash
        run: |
          set -euo pipefail
          echo '=== cluster ==='
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS https://bonfirework.org/api/system/cluster
          echo
          echo '=== readiness ==='
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS https://bonfirework.org/api/system/readiness
          echo
