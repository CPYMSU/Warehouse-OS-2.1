name: Current production probe

on:
  pull_request:
    paths:
      - .github/workflows/current-production-probe.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify fixed production branch head
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          encoded="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('fix/managed-runtime-owner-boundary', safe=''))
          PY
          )"
          curl -fsS "${auth[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/${encoded}" > /tmp/branch.json
          actual="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/branch.json'))['commit']['sha'])
          PY
          )"
          expected='b4b6d29dc55aa395683855d5fcf3154cad25d8c2'
          echo "TARGET_HEAD=${actual}"
          test "$actual" = "$expected"

      - name: Dispatch fixed smart production deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-deploy.yml/dispatches" \
            -d '{"ref":"fix/managed-runtime-owner-boundary","inputs":{"mode":"smart"}}'
          echo 'PRODUCTION_DISPATCHED=true'
