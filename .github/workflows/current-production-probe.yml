name: MK7 insulator-cleaning public probe

on:
  push:
    branches:
      - chatgpt/current-production-probe
    paths:
      - .github/workflows/current-production-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public MK7 course and catalog
        shell: bash
        run: |
          set -euo pipefail
          course='https://mk7-workspace.bonfirework.org/learn/500kv-insulator-cleaning-habitual-violations/'
          catalog='https://mk7-workspace.bonfirework.org/data/frontend_catalog.internal.json'
          image='https://mk7-workspace.bonfirework.org/learn/500kv-insulator-cleaning-habitual-violations/assets/photos/01_longfeng_500kv_insulator_cleaning.jpg'
          code="$(curl -sS -o /tmp/course.html -w '%{http_code}' --connect-timeout 15 --max-time 60 "$course" || true)"
          catalog_code="$(curl -sS -o /tmp/catalog.json -w '%{http_code}' --connect-timeout 15 --max-time 60 "$catalog" || true)"
          image_code="$(curl -sS -o /tmp/photo.jpg -w '%{http_code}' --connect-timeout 15 --max-time 60 "$image" || true)"
          echo "COURSE_HTTP=$code"
          echo "CATALOG_HTTP=$catalog_code"
          echo "IMAGE_HTTP=$image_code"
          for marker in '清扫不是' '六道安全门槛' '清—检—记' '36项'; do
            if grep -Fq "$marker" /tmp/course.html 2>/dev/null; then
              echo "MARKER_${marker}=1"
            else
              echo "MARKER_${marker}=0"
            fi
          done
          if grep -Fq '500kv-insulator-cleaning-habitual-violations' /tmp/catalog.json 2>/dev/null; then
            echo 'CATALOG_ENTRY=1'
          else
            echo 'CATALOG_ENTRY=0'
          fi
          test "$code" = 200
          test "$catalog_code" = 200
          test "$image_code" = 200
          grep -Fq '清扫不是' /tmp/course.html
          grep -Fq '六道安全门槛' /tmp/course.html
          grep -Fq '清—检—记' /tmp/course.html
          grep -Fq '36项' /tmp/course.html
          grep -Fq '500kv-insulator-cleaning-habitual-violations' /tmp/catalog.json
