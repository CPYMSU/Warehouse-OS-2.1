name: Current production probe

on:
  pull_request:
    paths:
      - .github/workflows/current-production-probe.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel this diagnostic branch Backend contract jobs
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          encoded='chatgpt%2Fcurrent-production-probe'
          curl -fsS "${auth[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/backend-contract.yml/runs?branch=${encoded}&event=pull_request&per_page=50" \
            > /tmp/contracts.json
          python3 - <<'PY' > /tmp/cancel.txt
          import json
          for r in json.load(open('/tmp/contracts.json')).get('workflow_runs', []):
              if r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          while read -r id; do
            [ -n "$id" ] || continue
            curl -sS -o /dev/null -X POST "${auth[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" || true
            echo "cancelled diagnostic contract ${id}"
          done < /tmp/cancel.txt

      - name: Inspect fixed production deploy
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${auth[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-deploy.yml/runs?branch=fix%2Fmanaged-runtime-owner-boundary&per_page=10" \
            > /tmp/runs.json
          python3 - <<'PY'
          import json
          target='b4b6d29dc55aa395683855d5fcf3154cad25d8c2'
          matched=[]
          for r in json.load(open('/tmp/runs.json')).get('workflow_runs', []):
              row={k:r.get(k) for k in ['id','status','conclusion','event','head_branch','head_sha','run_number','created_at','updated_at','html_url']}
              print(json.dumps(row, ensure_ascii=False))
              if r.get('head_sha') == target:
                  matched.append(row)
          print('TARGET_MATCHES='+json.dumps(matched, ensure_ascii=False))
          PY

      - name: Read current public production identity
        shell: bash
        run: |
          set -euo pipefail
          echo '=== cluster ==='
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS https://bonfirework.org/api/system/cluster
          echo
          echo '=== readiness ==='
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS https://bonfirework.org/api/system/readiness
          echo
