name: Diagnose MK7 rescue release transport
on:
  push:
    branches: [chatgpt/repair-mk7-rescue-images]
    paths: [.github/workflows/mk7-rescue-recovery-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 6
    steps:
      - name: Check cached source, SSH transports and actual image responses
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          python3 -u - <<'PY'
          import concurrent.futures,json,os,signal,shlex,subprocess,urllib.request,time
          from pathlib import Path
          expected='f9ad48fc918666b7bb88de481a5ae29a77a203fe'
          cache=Path('/Users/peiyuan/Server/bonfirework/cache/digital-asset-smart-deploy/registry')
          def command(args,env=None,timeout=25):
              p=subprocess.Popen(args,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)
              try:
                  out,err=p.communicate(timeout=timeout)
                  return {'returncode':p.returncode,'stdout':out[-1400:],'stderr':err[-700:]}
              except subprocess.TimeoutExpired:
                  os.killpg(p.pid,signal.SIGTERM)
                  try:p.communicate(timeout=3)
                  except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL);p.communicate()
                  return {'timeout':timeout}
          print('CACHE_HEAD',json.dumps(command(['git','-C',str(cache),'rev-parse','HEAD'])))
          print('CACHE_TARGET',json.dumps(command(['git','-C',str(cache),'cat-file','-e',expected+'^{commit}'])))
          key='/Users/peiyuan/Server/bonfirework/secrets/registry-readonly-ed25519-v2'
          ssh='/usr/bin/ssh -i '+shlex.quote(key)+' -o Hostname=ssh.github.com -p 443 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=accept-new'
          def git_probe(proxy):
              env={**os.environ,'GIT_TERMINAL_PROMPT':'0','GIT_CONFIG_COUNT':'0','GIT_SSH_COMMAND':ssh+(' -o '+shlex.quote('ProxyCommand=/usr/bin/nc -X connect -x 127.0.0.1:7897 %h %p') if proxy else '')}
              return {'transport':'local-proxy' if proxy else 'direct-ssh443',**command(['git','ls-remote','--exit-code','git@github.com:CPYMSU/registry.git','refs/heads/chatgpt/mk7-rescue-media-repair-release'],env=env,timeout=30)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              for result in pool.map(git_probe,[False,True]):print('GIT_TRANSPORT',json.dumps(result))
          suffix='learn/transmission-rope-rescue/units/high-angle-rescue-practice/'
          paths=['https://mk7-workspace.bonfirework.org/'+suffix,'https://mk7-workspace.bonfirework.org/'+suffix+'assets/approved/petzl-haul-ttr.svg?v=cc8aea230d583f40','https://bonfirework.org/assets/bonfire/mk7-workspace/'+suffix+'assets/approved/petzl-haul-ttr.svg?v=cc8aea230d583f40']
          def probe(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'MK7-Rescue-Repair-Probe/1.0','Sec-Fetch-Dest':'image' if '.svg' in url else 'document','Sec-Fetch-Site':'same-origin','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      b=r.read();return {'url':url,'status':r.status,'bytes':len(b),'content_type':r.headers.get('Content-Type'),'delivery':r.headers.get('X-Warehouse-Pages-Delivery'),'release':r.headers.get('X-Warehouse-Release'),'image_version_present':b'?v=cc8aea230d583f40' in b}
              except Exception as e:return {'url':url,'error':str(e)[:260]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              for result in pool.map(probe,paths):print('PUBLIC_PROBE',json.dumps(result))
          PY
