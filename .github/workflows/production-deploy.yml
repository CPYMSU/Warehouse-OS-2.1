name: Production fast smart deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment safety lane
        required: true
        default: smart
        type: choice
        options: [smart, quick, standard, full, storage-audit, primary-recovery]
      prepared_release:
        description: Prepared mac-primary release for primary-recovery
        required: false
        type: string
      recovery_confirmation:
        description: Enter ACTIVATE_PRIMARY_ONLY for primary-recovery
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: warehouse-production
  cancel-in-progress: false

jobs:
  coordinated-deploy:
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    # Ordinary releases still finish on the fast path.  The ceiling must also
    # cover the bounded one-time standby recovery lane, whose own hard limit is
    # 60 minutes and which continuously reports copy progress.
    timeout-minutes: 70
    env:
      DEPLOY_MODE: ${{ github.event.inputs.mode || 'smart' }}
      WAREHOUSE_CLUSTER_PREFLIGHT: basic
      WAREHOUSE_PRIMARY_TRANSPORT: local
      WAREHOUSE_PRIMARY_MANAGER_SUDO: "0"
      WAREHOUSE_PRIMARY_PREPARE_INCOMING: "0"
      WAREHOUSE_STANDBY_TRANSPORT: ssh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse stale queued revisions
        if: env.DEPLOY_MODE != 'storage-audit'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain=v1)"
      - name: Verify storage audit revision
        if: env.DEPLOY_MODE == 'storage-audit'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
      - name: Verify Mac workspace runtime storage
        if: env.DEPLOY_MODE != 'primary-recovery'
        env:
          WAREHOUSE_MAC_RUNTIME_STORAGE_APPROVED_UUID: ${{ vars.WAREHOUSE_MAC_RUNTIME_STORAGE_APPROVED_UUID }}
          WAREHOUSE_MAC_RUNTIME_STORAGE_APPROVED_MODEL: ${{ vars.WAREHOUSE_MAC_RUNTIME_STORAGE_APPROVED_MODEL }}
          WAREHOUSE_MAC_RUNTIME_STORAGE_REQUIRE_MIRROR: ${{ vars.WAREHOUSE_MAC_RUNTIME_STORAGE_REQUIRE_MIRROR || 'false' }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          ops/macos/audit-runtime-storage
      - name: Run coordinated fast deployment
        if: env.DEPLOY_MODE != 'primary-recovery' && env.DEPLOY_MODE != 'storage-audit'
        env:
          WAREHOUSE_CONTROL_REPL_PASSWORD: ${{ secrets.WAREHOUSE_CONTROL_REPL_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          ops/cluster/rolling-deploy "${DEPLOY_MODE}"
      - name: Activate verified primary recovery release
        if: env.DEPLOY_MODE == 'primary-recovery'
        env:
          PREPARED_RELEASE: ${{ github.event.inputs.prepared_release }}
          RECOVERY_CONFIRMATION: ${{ github.event.inputs.recovery_confirmation }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          test "${RECOVERY_CONFIRMATION}" = ACTIVATE_PRIMARY_ONLY
          [[ "${PREPARED_RELEASE}" =~ ^[0-9]{8}T[0-9]{6}Z-[A-Za-z0-9._-]+-mac-primary-(smart|quick|standard|full)$ ]]
          manager=/Users/peiyuan/Server/bonfirework/bin/warehouse-deploy
          test -x "${manager}"
          "${manager}" prepared-status "${PREPARED_RELEASE}"
          "${manager}" activate "${PREPARED_RELEASE}"
          "${manager}" status
