name: Production deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "browser-runtime/**"
      - "frontend/**"
      - "infra/**"
      - "scripts/**"
      - "ops/**"
      - "docs/**"
      - ".dockerignore"
      - "compose.production.yaml"
      - "README.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-production
  cancel-in-progress: false

jobs:
  freshness:
    name: Refuse a stale queued revision
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      current: ${{ steps.revision.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: revision
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "A newer main revision exists; this deployment is skipped." \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

  deploy-mac-primary:
    name: Deploy Mac primary
    needs: freshness
    if: needs.freshness.outputs.current == 'true'
    uses: ./.github/workflows/production-deploy-target.yml
    with:
      environment: mac-production
      target: mac-primary
      runs_on: '["self-hosted","macOS","ARM64","warehouse-production"]'
      transport: local
      verify_public: true
    secrets: inherit

  deploy-vultr-standby:
    name: Deploy Vultr standby
    needs: [freshness, deploy-mac-primary]
    if: >-
      needs.freshness.outputs.current == 'true' &&
      needs.deploy-mac-primary.result == 'success'
    uses: ./.github/workflows/production-deploy-target.yml
    with:
      environment: production
      target: vultr-standby
      runs_on: '["ubuntu-latest"]'
      transport: ssh
      verify_public: false
    secrets: inherit

  no-op:
    name: Record a stale no-op
    needs: freshness
    if: needs.freshness.outputs.current == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No deployment started because this queued revision is stale."
