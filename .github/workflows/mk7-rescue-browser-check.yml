name: MK7 rescue browser verification
on:
  push:
    branches: [chatgpt/repair-mk7-rescue-images]
    paths: [.github/workflows/mk7-rescue-browser-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install isolated browser test tools
        run: |
          mkdir -p "$RUNNER_TEMP/mk7-browser-check"
          cd "$RUNNER_TEMP/mk7-browser-check"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium webkit
      - name: Test actual course images and image dialogs
        run: |
          cd "$RUNNER_TEMP/mk7-browser-check"
          mkdir -p evidence
          cat > test.cjs <<'JS'
          const {chromium,webkit,devices}=require('playwright');
          const fs=require('fs');
          const paths=[
          'learn/first-aid-cpr/units/cpr-aed/',
          'learn/transmission-rope-rescue/units/equipment-and-personal-skills/',
          'learn/transmission-rope-rescue/units/powered-ascender-and-assisted-hauling/',
          'learn/transmission-rope-rescue/units/high-angle-rescue-practice/'];
          const bases=['https://mk7-workspace.bonfirework.org/','https://bonfirework.org/assets/bonfire/mk7-workspace/'];
          const results=[];
          (async()=>{
            for (const [name,engine] of [['chromium',chromium],['webkit',webkit]]) {
              const browser=await engine.launch({headless:true});
              for(let bi=0;bi<bases.length;bi++)for(let pi=0;pi<paths.length;pi++){
                const context=await browser.newContext(name==='webkit'?{...devices['iPhone 13']}:{viewport:{width:1440,height:1000}});
                const page=await context.newPage();
                const r={engine:name,url:bases[bi]+paths[pi],console:[],errors:[],failed:[],badResponses:[],imageResponses:[]};
                page.on('console',m=>{if(m.type()==='error'||m.type()==='warning')r.console.push(m.text().slice(0,500))});
                page.on('pageerror',e=>r.errors.push(e.message));
                page.on('requestfailed',req=>r.failed.push({url:req.url(),failure:req.failure()}));
                page.on('response',res=>{if(res.status()>=400)r.badResponses.push({status:res.status(),url:res.url()});if(res.request().resourceType()==='image')r.imageResponses.push({status:res.status(),url:res.url(),headers:res.headers()})});
                try {
                  const res=await page.goto(r.url,{waitUntil:'domcontentloaded',timeout:90000});
                  r.status=res.status();r.headers=res.headers();
                  await page.waitForTimeout(4500);
                  await page.evaluate(async()=>{for(let y=0;y<document.body.scrollHeight;y+=900){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,50));}window.scrollTo(0,0)});
                  await page.waitForTimeout(2000);
                  r.finalUrl=page.url();
                  r.images=await page.evaluate(()=>Array.from(document.images).map(i=>({src:i.getAttribute('src'),currentSrc:i.currentSrc,complete:i.complete,width:i.naturalWidth,height:i.naturalHeight,display:getComputedStyle(i).display,visibility:getComputedStyle(i).visibility,opacity:getComputedStyle(i).opacity,rect:{width:i.getBoundingClientRect().width,height:i.getBoundingClientRect().height}})));
                  r.bodyText=(await page.locator('body').innerText()).slice(0,1200);
                  await page.screenshot({path:`evidence/${name}-${bi}-${pi}.png`,fullPage:false});
                  const opener=page.locator('[data-open-image]').first();
                  if(await opener.count()){
                    await opener.click({timeout:8000});await page.waitForTimeout(1200);
                    r.modal=await page.evaluate(()=>Array.from(document.querySelectorAll('dialog[open] img')).map(i=>({src:i.currentSrc,complete:i.complete,width:i.naturalWidth})));
                    await page.screenshot({path:`evidence/${name}-${bi}-${pi}-dialog.png`});
                  }
                }catch(e){r.testError=e.message;}
                results.push(r);await context.close();
              }
              await browser.close();
            }
            fs.writeFileSync('evidence/browser-results.json',JSON.stringify(results,null,2));
            for(const r of results)console.log(JSON.stringify({engine:r.engine,url:r.url,status:r.status,images:r.images?.length,broken:r.images?.filter(i=>i.src&&(!i.complete||!i.width)),errors:r.errors,console:r.console,failed:r.failed,badResponses:r.badResponses,modal:r.modal,testError:r.testError}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mk7-rescue-browser-evidence
          path: ${{ runner.temp }}/mk7-browser-check/evidence
          retention-days: 7
