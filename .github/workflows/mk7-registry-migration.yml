name: MK7 registry migration

on:
  pull_request:
    paths:
      - .github/workflows/mk7-registry-migration.yml

permissions:
  contents: read

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 15
    steps:
      - name: Validate MK7 source archive
        shell: bash
        run: |
          set -euo pipefail
          archive='/Users/peiyuan/Server/bonfirework/shared/runtime-volumes-recovered.internal-rollback-20260812T125010Z/.staging/mk7-32ef4097.tar.gz'
          test -f "$archive"
          expected='32ef40976c7038e5e55ca9a7dbf844666386a7663f0da0be87265ce96a36bcb4'
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/mk7-export"
          cp "$archive" "$RUNNER_TEMP/mk7-export/mk7-32ef4097.tar.gz"
          printf '%s\n' "$actual" > "$RUNNER_TEMP/mk7-export/SHA256.txt"

      - name: Upload validated MK7 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mk7-source-snapshot
          path: ${{ runner.temp }}/mk7-export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
