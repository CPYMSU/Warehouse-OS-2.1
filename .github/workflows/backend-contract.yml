name: Backend contract

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/v2/**"
      - "scripts/**"
      - "compose.yaml"
      - ".github/workflows/backend-contract.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/v2/**"
      - "scripts/**"
      - "compose.yaml"
      - ".github/workflows/backend-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e 'backend[dev]'

      - name: Start PostgreSQL 18 with pgvector
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U warehouse_os -d warehouse_os; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Apply migrations
        working-directory: backend
        env:
          WAREHOUSE_ENVIRONMENT: test
          WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse_os:local-only-change-me@127.0.0.1:5432/warehouse_os
          WAREHOUSE_MIGRATION_DATABASE_URL: postgresql+psycopg://warehouse_migrator:local-only-migration-change-me@127.0.0.1:5432/warehouse_os
          WAREHOUSE_JWT_SECRET: test-only-warehouse-secret-32-characters
        run: alembic upgrade head

      - name: Lint
        working-directory: backend
        run: ruff check app tests alembic/versions

      - name: Test
        working-directory: backend
        env:
          WAREHOUSE_ENVIRONMENT: test
          WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse_os:local-only-change-me@127.0.0.1:5432/warehouse_os
          WAREHOUSE_MIGRATION_DATABASE_URL: postgresql+psycopg://warehouse_migrator:local-only-migration-change-me@127.0.0.1:5432/warehouse_os
          WAREHOUSE_JWT_SECRET: test-only-warehouse-secret-32-characters
        run: pytest -q

      - name: Verify precompiled frontend
        run: node scripts/build_v2_frontend.cjs --check
