name: Backend contract

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "mobile/**"
      - "wechat-miniapp/**"
      - "scripts/**"
      - "compose.yaml"
      - ".github/workflows/backend-contract.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "mobile/**"
      - "wechat-miniapp/**"
      - "scripts/**"
      - "compose.yaml"
      - ".github/workflows/backend-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_DB: warehouse_os
          POSTGRES_USER: warehouse_admin
          POSTGRES_PASSWORD: local-only-change-me
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse_admin -d warehouse_os"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e 'backend[dev]'

      - name: Initialize database roles and pgvector
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://warehouse_admin:local-only-change-me@127.0.0.1:5432/warehouse_os",
              autocommit=True,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("CREATE EXTENSION IF NOT EXISTS vector")
                  cursor.execute(
                      "CREATE ROLE warehouse_migrator LOGIN NOSUPERUSER NOCREATEDB "
                      "NOCREATEROLE NOINHERIT NOREPLICATION "
                      "PASSWORD 'local-only-migration-change-me'"
                  )
                  cursor.execute(
                      "CREATE ROLE warehouse_os LOGIN NOSUPERUSER NOCREATEDB "
                      "NOCREATEROLE NOINHERIT NOREPLICATION "
                      "PASSWORD 'local-only-change-me'"
                  )
                  cursor.execute("REVOKE CREATE ON DATABASE warehouse_os FROM PUBLIC")
                  cursor.execute(
                      "GRANT CONNECT, TEMPORARY ON DATABASE warehouse_os "
                      "TO warehouse_migrator, warehouse_os"
                  )
                  cursor.execute("GRANT CREATE ON DATABASE warehouse_os TO warehouse_migrator")
                  cursor.execute("CREATE SCHEMA app AUTHORIZATION warehouse_migrator")
          PY

      - name: Apply migrations
        working-directory: backend
        env:
          WAREHOUSE_ENVIRONMENT: test
          WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse_os:local-only-change-me@127.0.0.1:5432/warehouse_os
          WAREHOUSE_MIGRATION_DATABASE_URL: postgresql+psycopg://warehouse_migrator:local-only-migration-change-me@127.0.0.1:5432/warehouse_os
          WAREHOUSE_JWT_SECRET: test-only-warehouse-secret-32-characters
        run: alembic upgrade head

      - name: Lint
        working-directory: backend
        run: ruff check app tests alembic/versions

      - name: Audit retained frontend API contracts
        env:
          WAREHOUSE_ENVIRONMENT: test
          WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse_os:local-only-change-me@127.0.0.1:5432/warehouse_os
          WAREHOUSE_JWT_SECRET: test-only-warehouse-secret-32-characters
        run: python scripts/audit_frontend_api_contracts.py --fail-on-missing

      - name: Upload frontend API contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-api-contract-report
          path: frontend-api-contract-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Test
        working-directory: backend
        env:
          WAREHOUSE_ENVIRONMENT: test
          WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse_os:local-only-change-me@127.0.0.1:5432/warehouse_os
          WAREHOUSE_MIGRATION_DATABASE_URL: postgresql+psycopg://warehouse_migrator:local-only-migration-change-me@127.0.0.1:5432/warehouse_os
          WAREHOUSE_JWT_SECRET: test-only-warehouse-secret-32-characters
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: backend/pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Test MapLibre teardown guard
        run: node scripts/test_maplibre_abort_guard.cjs

      - name: Verify precompiled frontend
        run: node scripts/build_v2_frontend.cjs --check
