name: Basic pull request checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "browser-runtime/**"
      - "frontend/**"
      - "infra/**"
      - "scripts/**"
      - "ops/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Python sources
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/python-cache" \
            python -m compileall -q backend/app backend/alembic/versions

      - name: Check deployment shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n \
            ops/deploy \
            ops/macos/warehouse-deploy-macos \
            ops/macos/warehouse-deploy-ssh-gate \
            ops/run-full-verification \
            ops/server/warehouse-deploy \
            infra/backup/warehouse-postgres-backup.sh

      - name: Verify committed frontend bundles
        run: node scripts/build_v2_frontend.cjs --check

      - name: Check deployment planner output
        shell: bash
        run: |
          set -Eeuo pipefail
          python ops/deploy-plan \
            --changed-file backend/app/core/config.py \
            --format json | python -m json.tool >/dev/null
