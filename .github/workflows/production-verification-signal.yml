name: Production hosting verification signal

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/production-verification/expected-sha.txt"

permissions:
  contents: read

concurrency:
  group: warehouse-production-verification
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.actor == 'CPYMSU' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://bonfirework.org
    env:
      WAREHOUSE_DEPLOY_HOST: ${{ vars.WAREHOUSE_DEPLOY_HOST }}
      WAREHOUSE_DEPLOY_USER: ${{ vars.WAREHOUSE_DEPLOY_USER }}
      WAREHOUSE_REMOTE_DEPLOY_MANAGER: ${{ vars.WAREHOUSE_REMOTE_DEPLOY_MANAGER }}
      WAREHOUSE_DEPLOY_IDENTITY: ${{ runner.temp }}/warehouse-ssh/id_ed25519
      WAREHOUSE_HOSTING_MATRIX_LOG: ${{ runner.temp }}/hosting-matrix.log

    steps:
      - name: Check out verification request
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve expected deployed revision
        id: expected
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(tr -d '[:space:]' < docs/production-verification/expected-sha.txt)"
          [[ "${expected}" =~ ^[a-f0-9]{40}$ ]] || {
            echo "expected-sha.txt must contain exactly one full Git commit SHA" >&2
            exit 2
          }
          echo "sha=${expected}" >> "${GITHUB_OUTPUT}"
          echo "prefix=${expected:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Install restricted deployment identity
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.WAREHOUSE_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.WAREHOUSE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${WAREHOUSE_DEPLOY_HOST:?production variable is required}"
          : "${WAREHOUSE_DEPLOY_USER:?production variable is required}"
          : "${WAREHOUSE_REMOTE_DEPLOY_MANAGER:?production variable is required}"
          : "${DEPLOY_SSH_KEY:?production secret is required}"
          : "${DEPLOY_KNOWN_HOSTS:?production secret is required}"
          install -d -m 0700 "${RUNNER_TEMP}/warehouse-ssh" "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${WAREHOUSE_DEPLOY_IDENTITY}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${WAREHOUSE_DEPLOY_IDENTITY}" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${WAREHOUSE_DEPLOY_IDENTITY}" >/dev/null

      - name: Require expected release to be active and healthy
        id: release
        shell: bash
        env:
          EXPECTED_PREFIX: ${{ steps.expected.outputs.prefix }}
        run: |
          set -Eeuo pipefail
          status_file="${RUNNER_TEMP}/production-status.txt"
          matched=false
          for attempt in $(seq 1 90); do
            ssh \
              -i "${WAREHOUSE_DEPLOY_IDENTITY}" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "${WAREHOUSE_DEPLOY_USER}@${WAREHOUSE_DEPLOY_HOST}" \
              "sudo -n ${WAREHOUSE_REMOTE_DEPLOY_MANAGER} status" \
              > "${status_file}"
            if grep -Eq "^release=.*${EXPECTED_PREFIX}" "${status_file}" \
              && grep -q '"status":"ok"' "${status_file}"; then
              matched=true
              break
            fi
            sleep 10
          done
          cat "${status_file}"
          [[ "${matched}" == true ]] || {
            echo "Expected release ${EXPECTED_PREFIX} is not active and healthy." >&2
            exit 1
          }
          echo "matched=true" >> "${GITHUB_OUTPUT}"

      - name: Verify source upload, Runtime, public web, backend and database
        id: matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ops/hosting-smoke-matrix bonfire "verify${GITHUB_RUN_ID}" \
            2>&1 | tee "${WAREHOUSE_HOSTING_MATRIX_LOG}"

      - name: Roll back only when matched release fails real hosting matrix
        if: failure() && steps.release.outputs.matched == 'true' && steps.matrix.outcome == 'failure'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "${WAREHOUSE_DEPLOY_IDENTITY}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${WAREHOUSE_DEPLOY_USER}@${WAREHOUSE_DEPLOY_HOST}" \
            "sudo -n ${WAREHOUSE_REMOTE_DEPLOY_MANAGER} rollback"
          curl --fail --silent --show-error --max-time 20 \
            https://bonfirework.org/api/health

      - name: Capture final production status
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "${WAREHOUSE_DEPLOY_IDENTITY}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${WAREHOUSE_DEPLOY_USER}@${WAREHOUSE_DEPLOY_HOST}" \
            "sudo -n ${WAREHOUSE_REMOTE_DEPLOY_MANAGER} status" \
            > "${RUNNER_TEMP}/production-status-final.txt"
          cat "${RUNNER_TEMP}/production-status-final.txt"

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-hosting-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-status.txt
            ${{ runner.temp }}/production-status-final.txt
            ${{ runner.temp }}/hosting-matrix.log
          if-no-files-found: ignore
          retention-days: 30
