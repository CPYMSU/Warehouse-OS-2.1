name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel older diagnostics on this branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel.txt
          for workflow in 321396252 339511072; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100" > /tmp/runs.json
            CURRENT_RUN_ID="$GITHUB_RUN_ID" python3 - <<'PY' >> /tmp/cancel.txt
          import json, os
          data=json.load(open('/tmp/runs.json'))
          current=int(os.environ['CURRENT_RUN_ID'])
          for r in data.get('workflow_runs',[]):
              if int(r.get('id',0)) != current and r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          done
          sort -u /tmp/cancel.txt -o /tmp/cancel.txt
          while read -r id; do
            [ -n "$id" ] || continue
            curl -fsS -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null || true
          done < /tmp/cancel.txt

  origin-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare Cloudflare and direct Vultr origin
        shell: bash
        run: |
          set -u
          echo '=== cloudflare ==='
          curl --connect-timeout 5 --max-time 15 -sS -D - https://bonfirework.org/health -o /tmp/cf.out || true
          cat /tmp/cf.out 2>/dev/null || true
          echo '=== direct vultr origin ==='
          curl -k --connect-timeout 5 --max-time 15 --resolve bonfirework.org:443:207.148.120.30 -sS -D - https://bonfirework.org/health -o /tmp/origin.out || true
          cat /tmp/origin.out 2>/dev/null || true

  standby-status:
    needs: cleanup-backlog
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Read Mac and Vultr production state
        shell: bash
        run: |
          set -u
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo '=== mac primary ==='
          /Users/peiyuan/Server/bonfirework/bin/warehouse-deploy status || true
          echo '=== vultr standby ==='
          ssh -F /dev/null \
            -i "$HOME/.ssh/warehouse_os_deploy_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            warehouse-deploy@207.148.120.30 'sudo -n /usr/local/sbin/warehouse-deploy status' || true
          echo '=== vultr api logs ==='
          ssh -F /dev/null \
            -i "$HOME/.ssh/warehouse_os_deploy_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            warehouse-deploy@207.148.120.30 'sudo -n /usr/local/sbin/warehouse-deploy api-logs' 2>&1 | tail -n 100 || true
