name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  queue-cleanup-and-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clear this diagnostic branch and list remaining active runs
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel.txt
          for workflow in 321396252 339511072; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100" > /tmp/runs.json
            CURRENT_RUN_ID="$GITHUB_RUN_ID" python3 - <<'PY' >> /tmp/cancel.txt
          import json, os
          d=json.load(open('/tmp/runs.json')); current=int(os.environ['CURRENT_RUN_ID'])
          for r in d.get('workflow_runs',[]):
              if int(r.get('id',0)) != current and r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          done
          sort -u /tmp/cancel.txt -o /tmp/cancel.txt
          while read -r id; do
            [ -n "$id" ] || continue
            echo "force-cancel diagnostic run ${id}"
            curl -fsS -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" >/dev/null || true
          done < /tmp/cancel.txt
          sleep 2
          echo '=== remaining active runs ==='
          for status in in_progress queued waiting; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" > /tmp/active.json
            STATUS="$status" CURRENT_RUN_ID="$GITHUB_RUN_ID" python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/active.json')); current=int(os.environ['CURRENT_RUN_ID'])
          for r in d.get('workflow_runs',[]):
              if int(r.get('id',0)) == current: continue
              print(json.dumps({"status":os.environ['STATUS'],"id":r.get('id'),"name":r.get('name'),"head_branch":r.get('head_branch'),"event":r.get('event'),"created_at":r.get('created_at')},ensure_ascii=False))
          PY
          done
