name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Force-cancel older diagnostics on this branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel.txt
          for workflow in 321396252 339511072; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100" > /tmp/runs.json
            CURRENT_RUN_ID="$GITHUB_RUN_ID" python3 - <<'PY' >> /tmp/cancel.txt
          import json, os
          d=json.load(open('/tmp/runs.json')); current=int(os.environ['CURRENT_RUN_ID'])
          for r in d.get('workflow_runs',[]):
              if int(r.get('id',0)) != current and r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          done
          sort -u /tmp/cancel.txt -o /tmp/cancel.txt
          while read -r id; do
            [ -n "$id" ] || continue
            curl -fsS -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" >/dev/null || true
          done < /tmp/cancel.txt

  repair-cloudflare-origin:
    needs: cleanup-backlog
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Switch cloudflared origin to OrbStack direct container DNS with rollback
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.orbstack/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          old='http://127.0.0.1:8081'
          new='http://bonfirework-mac-api.orb.local:8080'
          uid="$(id -u)"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          configs=("$HOME/.cloudflared/config.yml" "$HOME/.cloudflared/pages-config.yml")
          labels=(org.bonfirework.cloudflared org.bonfirework.cloudflared-pages)
          backups=()

          curl -fsS --connect-timeout 3 --max-time 8 "${new}/health" >/tmp/direct-health.json
          grep -Fq '"status":"ok"' /tmp/direct-health.json
          echo 'direct_orb_origin=healthy'

          changed=0
          for i in 0 1; do
            cfg="${configs[$i]}"
            label="${labels[$i]}"
            [ -f "$cfg" ] || continue
            if grep -Fq "$old" "$cfg"; then
              backup="${cfg}.bak-${stamp}"
              cp -p "$cfg" "$backup"
              backups+=("$cfg|$backup|$label")
              python3 - "$cfg" "$old" "$new" <<'PY'
          import pathlib, sys
          path=pathlib.Path(sys.argv[1]); old=sys.argv[2]; new=sys.argv[3]
          text=path.read_text()
          if old not in text:
              raise SystemExit('expected origin not found')
          path.write_text(text.replace(old,new))
          PY
              changed=1
              echo "updated_config=$(basename "$cfg")"
            fi
          done
          [ "$changed" -eq 1 ] || { echo 'no cloudflared origin required change'; exit 1; }

          rollback() {
            echo 'restoring cloudflared config backups' >&2
            for item in "${backups[@]}"; do
              IFS='|' read -r cfg backup label <<<"$item"
              cp -p "$backup" "$cfg"
              launchctl kickstart -k "gui/${uid}/${label}" >/dev/null 2>&1 || true
            done
          }
          trap rollback ERR

          for item in "${backups[@]}"; do
            IFS='|' read -r cfg backup label <<<"$item"
            grep -Fq "$new" "$cfg"
            launchctl kickstart -k "gui/${uid}/${label}"
          done

          sleep 3
          echo '=== verify public health ==='
          for attempt in $(seq 1 20); do
            if curl -fsS --connect-timeout 3 --max-time 8 https://bonfirework.org/health >/tmp/public-health.json 2>/dev/null; then
              grep -Fq '"status":"ok"' /tmp/public-health.json
              echo "public_health_recovered=true attempt=${attempt}"
              cat /tmp/public-health.json; echo
              trap - ERR
              exit 0
            fi
            sleep 2
          done
          echo 'public health did not recover after tunnel origin switch' >&2
          false
