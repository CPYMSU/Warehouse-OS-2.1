name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Force-cancel older diagnostics on this branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel.txt
          for workflow in 321396252 339511072; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100" > /tmp/runs.json
            CURRENT_RUN_ID="$GITHUB_RUN_ID" python3 - <<'PY' >> /tmp/cancel.txt
          import json, os
          d=json.load(open('/tmp/runs.json')); current=int(os.environ['CURRENT_RUN_ID'])
          for r in d.get('workflow_runs',[]):
              if int(r.get('id',0)) != current and r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          done
          sort -u /tmp/cancel.txt -o /tmp/cancel.txt
          while read -r id; do
            [ -n "$id" ] || continue
            curl -fsS -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" >/dev/null || true
          done < /tmp/cancel.txt

  port-8081:
    needs: cleanup-backlog
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 4
    steps:
      - name: Inspect Cloudflare local origin and old release binding
        shell: bash
        run: |
          set -u
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo '=== manager status ==='
          /Users/peiyuan/Server/bonfirework/bin/warehouse-deploy status || true
          echo '=== API container ports ==='
          docker ps --filter name=bonfirework-mac-api --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          docker inspect bonfirework-mac-api --format '{{json .NetworkSettings.Ports}}' 2>/dev/null || true
          echo '=== listener 8081 ==='
          lsof -nP -iTCP:8081 -sTCP:LISTEN 2>/dev/null || true
          echo '=== host probes ==='
          for path in /health /api/system/readiness /openapi.json; do
            echo "-- ${path}"
            curl -v --connect-timeout 3 --max-time 10 "http://127.0.0.1:8081${path}" -o /tmp/probe.out 2>&1 | tail -n 30 || true
            if [ -f /tmp/probe.out ]; then head -c 500 /tmp/probe.out; echo; fi
          done
          echo '=== relevant compose port declarations ==='
          for f in /Users/peiyuan/Server/bonfirework/compose.macos.yaml /Users/peiyuan/Server/bonfirework/state/compose.release.yaml /Users/peiyuan/Server/bonfirework/state/compose.previous.yaml; do
            if [ -f "$f" ]; then
              echo "file=$f"
              grep -nE 'bonfirework-mac-api|ports:|8080|8081' "$f" | head -n 80 || true
            fi
          done
