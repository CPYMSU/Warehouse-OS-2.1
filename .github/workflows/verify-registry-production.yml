name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  runner-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect self-hosted runner and active actions
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          echo '=== runners ==='
          curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(json.dumps({"id":r.get("id"),"name":r.get("name"),"status":r.get("status"),"busy":r.get("busy"),"labels":[x.get("name") for x in r.get("labels",[])]},ensure_ascii=False)) for r in d.get("runners",[])]'
          echo '=== active runs ==='
          for status in in_progress queued waiting; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" > /tmp/runs.json
            STATUS="$status" python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/runs.json'))
          for r in d.get('workflow_runs',[]):
              print(json.dumps({"status":os.environ['STATUS'],"id":r.get('id'),"name":r.get('name'),"head_branch":r.get('head_branch'),"event":r.get('event'),"created_at":r.get('created_at')},ensure_ascii=False))
          PY
          done
