name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel temporary Mac-runner backlog from this diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel-ids.txt
          for workflow in 321396252 339511072; do
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100"
            curl -fsS "${auth[@]}" "$api" > "/tmp/runs-${workflow}.json"
            CURRENT_RUN_ID="${GITHUB_RUN_ID}" python3 - "$workflow" <<'PY' >> /tmp/cancel-ids.txt
          import json, os, sys
          workflow=sys.argv[1]
          current=int(os.environ['CURRENT_RUN_ID'])
          with open(f'/tmp/runs-{workflow}.json') as f:
              data=json.load(f)
          for run in data.get('workflow_runs', []):
              if int(run.get('id',0)) != current and run.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(run['id'])
          PY
          done
          sort -u /tmp/cancel-ids.txt -o /tmp/cancel-ids.txt
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "cancel temporary run ${run_id}"
            curl -fsS -X POST "${auth[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
          done </tmp/cancel-ids.txt

  mac-status:
    needs: cleanup-backlog
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Read current production state after failed rollout
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          manager=/Users/peiyuan/Server/bonfirework/bin/warehouse-deploy
          echo '=== manager status ==='
          "$manager" status || true
          echo '=== containers ==='
          docker ps --format '{{.Names}}\t{{.Status}}\t{{.Image}}' | grep -E 'bonfirework|warehouse' || true
          echo '=== mac api recent logs ==='
          docker logs --tail 120 bonfirework-mac-api 2>&1 || true
          echo '=== local TLS health ==='
          curl -k --connect-timeout 5 --max-time 15 --resolve bonfirework.org:443:127.0.0.1 -sS -D - https://bonfirework.org/health -o /tmp/local-health.out || true
          cat /tmp/local-health.out 2>/dev/null || true
          echo '=== public health ==='
          curl --connect-timeout 5 --max-time 15 -sS -D - https://bonfirework.org/health -o /tmp/public-health.out || true
          cat /tmp/public-health.out 2>/dev/null || true
          echo '=== recent deployment history ==='
          "$manager" history | sed -n '1,30p' || true
