name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: read

jobs:
  action-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect recent production deploy runs
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-deploy.yml/runs?branch=main&event=push&per_page=10"
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(json.dumps({k:r.get(k) for k in ("id","status","conclusion","head_sha","created_at","updated_at","html_url")}, ensure_ascii=False)) for r in d.get("workflow_runs", [])]'

  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public production identity
        shell: bash
        run: |
          set -euo pipefail
          expected='ee8eb2d8b782af6c8e161b5a4671ca4d345cef06'
          echo 'PROBE_ITERATION=6'
          echo "EXPECTED_GIT_SHA=${expected}"
          echo '=== public cluster identity ==='
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS https://bonfirework.org/api/system/cluster
          echo
          echo '=== public readiness ==='
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS https://bonfirework.org/api/system/readiness
          echo
          echo '=== public health ==='
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS https://bonfirework.org/health
          echo
