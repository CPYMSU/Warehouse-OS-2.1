name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Force-cancel older diagnostics on this branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel.txt
          for workflow in 321396252 339511072; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100" > /tmp/runs.json
            CURRENT_RUN_ID="$GITHUB_RUN_ID" python3 - <<'PY' >> /tmp/cancel.txt
          import json, os
          d=json.load(open('/tmp/runs.json')); current=int(os.environ['CURRENT_RUN_ID'])
          for r in d.get('workflow_runs',[]):
              if int(r.get('id',0)) != current and r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          done
          sort -u /tmp/cancel.txt -o /tmp/cancel.txt
          while read -r id; do
            [ -n "$id" ] || continue
            curl -fsS -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" >/dev/null || true
          done < /tmp/cancel.txt

  restart-orbstack:
    needs: cleanup-backlog
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 8
    steps:
      - name: Restart OrbStack engine and verify production recovery
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.orbstack/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          critical=(bonfirework-mac-api bonfirework-mac-runtime-controller bonfirework-mac-research bonfirework-mac-browser)
          expected_release='20260817T025629Z-57c7a4d691a2-mac-primary-smart'

          status="$($HOME/Server/bonfirework/bin/warehouse-deploy status)"
          printf '%s\n' "$status"
          grep -Fq "release=${expected_release}" <<<"$status"
          for name in "${critical[@]}"; do
            policy="$(docker inspect "$name" --format '{{.HostConfig.RestartPolicy.Name}}')"
            [ "$policy" = unless-stopped ] || { echo "refusing OrbStack restart: ${name} restart=${policy}" >&2; exit 1; }
          done

          echo '=== restart OrbStack ==='
          orbctl restart

          for attempt in $(seq 1 120); do
            if [ "$(orbctl status 2>/dev/null || true)" = Running ] && docker info >/dev/null 2>&1; then
              echo "orbstack_running=true attempt=${attempt}"
              break
            fi
            [ "$attempt" -lt 120 ] || { echo 'OrbStack did not return' >&2; exit 1; }
            sleep 1
          done

          echo '=== wait critical containers ==='
          for attempt in $(seq 1 120); do
            all_ok=1
            for name in "${critical[@]}"; do
              state="$(docker inspect "$name" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' 2>/dev/null || true)"
              if [ "$state" != healthy ] && [ "$state" != running ]; then all_ok=0; fi
            done
            [ "$all_ok" -eq 1 ] && break
            [ "$attempt" -lt 120 ] || { echo 'critical containers did not recover' >&2; docker ps; exit 1; }
            sleep 1
          done
          docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'bonfirework-mac-(api|runtime-controller|research|browser)'

          echo '=== verify 8081 ==='
          for attempt in $(seq 1 60); do
            if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8081/health >/tmp/local-health.json 2>/dev/null; then
              echo "local_8081_recovered=true attempt=${attempt}"
              cat /tmp/local-health.json; echo
              break
            fi
            [ "$attempt" -lt 60 ] || { echo 'local 8081 still unhealthy after OrbStack restart' >&2; exit 1; }
            sleep 1
          done

          echo '=== verify Cloudflare public health ==='
          for attempt in $(seq 1 60); do
            if curl -fsS --connect-timeout 3 --max-time 8 https://bonfirework.org/health >/tmp/public-health.json 2>/dev/null; then
              echo "public_health_recovered=true attempt=${attempt}"
              cat /tmp/public-health.json; echo
              curl -fsS --connect-timeout 3 --max-time 8 https://bonfirework.org/api/system/cluster; echo
              exit 0
            fi
            [ "$attempt" -lt 60 ] || { echo 'public health still unavailable after OrbStack recovery' >&2; exit 2; }
            sleep 2
          done
