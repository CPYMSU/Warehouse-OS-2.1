name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel older diagnostics on this branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel.txt
          for workflow in 321396252 339511072; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100" > /tmp/runs.json
            CURRENT_RUN_ID="$GITHUB_RUN_ID" python3 - <<'PY' >> /tmp/cancel.txt
          import json, os
          data=json.load(open('/tmp/runs.json'))
          current=int(os.environ['CURRENT_RUN_ID'])
          for r in data.get('workflow_runs',[]):
              if int(r.get('id',0)) != current and r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          done
          sort -u /tmp/cancel.txt -o /tmp/cancel.txt
          while read -r id; do
            [ -n "$id" ] || continue
            curl -fsS -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null || true
          done < /tmp/cancel.txt

  tunnel-config:
    needs: cleanup-backlog
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 4
    steps:
      - name: Read non-secret Cloudflare Tunnel routing and errors
        shell: bash
        run: |
          set -u
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo '=== launch agent routing metadata ==='
          python3 - <<'PY'
          import plistlib, pathlib
          for name in ('org.bonfirework.cloudflared.plist','org.bonfirework.cloudflared-pages.plist'):
              path=pathlib.Path.home()/'Library'/'LaunchAgents'/name
              if not path.exists():
                  continue
              p=plistlib.loads(path.read_bytes())
              print('label=', p.get('Label'))
              print('program=', p.get('Program'))
              args=p.get('ProgramArguments') or []
              safe=[]
              skip=False
              for i,a in enumerate(args):
                  if skip:
                      skip=False
                      continue
                  if a in {'--token','--credentials-file','--origincert'}:
                      safe.extend([a,'<redacted>']); skip=True; continue
                  if a.startswith('eyJ') or len(a)>120:
                      safe.append('<redacted>'); continue
                  safe.append(a)
              print('args=', safe)
              print('stdout=', p.get('StandardOutPath'))
              print('stderr=', p.get('StandardErrorPath'))
          PY
          echo '=== config route lines only ==='
          for f in "$HOME/.cloudflared/config.yml" "$HOME/.cloudflared/config.yaml" /opt/homebrew/etc/cloudflared/config.yml /opt/homebrew/etc/cloudflared/config.yaml; do
            if [ -f "$f" ]; then
              echo "config=$f"
              grep -E '^[[:space:]]*(hostname|service):' "$f" || true
            fi
          done
          echo '=== launch-agent referenced config files ==='
          python3 - <<'PY'
          import plistlib, pathlib
          paths=[]
          for name in ('org.bonfirework.cloudflared.plist','org.bonfirework.cloudflared-pages.plist'):
              pth=pathlib.Path.home()/'Library'/'LaunchAgents'/name
              if not pth.exists(): continue
              p=plistlib.loads(pth.read_bytes()); args=p.get('ProgramArguments') or []
              for i,a in enumerate(args[:-1]):
                  if a == '--config': paths.append(args[i+1])
          for raw in paths:
              p=pathlib.Path(raw).expanduser()
              if p.exists():
                  print('config=',p)
                  for line in p.read_text(errors='ignore').splitlines():
                      s=line.strip()
                      if s.startswith('hostname:') or s.startswith('service:'):
                          print(s)
          PY
          echo '=== cloudflared recent errors ==='
          python3 - <<'PY'
          import plistlib, pathlib
          seen=set()
          for name in ('org.bonfirework.cloudflared.plist','org.bonfirework.cloudflared-pages.plist'):
              pth=pathlib.Path.home()/'Library'/'LaunchAgents'/name
              if not pth.exists(): continue
              p=plistlib.loads(pth.read_bytes())
              for key in ('StandardErrorPath','StandardOutPath'):
                  raw=p.get(key)
                  if raw and raw not in seen:
                      seen.add(raw); f=pathlib.Path(raw).expanduser()
                      print('log=', f)
                      if f.exists():
                          lines=f.read_text(errors='ignore').splitlines()[-80:]
                          for line in lines:
                              low=line.lower()
                              if any(w in low for w in ('error','failed','refused','connect','origin','service')):
                                  print(line[:800])
          PY
