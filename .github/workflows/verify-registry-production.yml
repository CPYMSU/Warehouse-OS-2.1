name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read

jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public production identity
        shell: bash
        run: |
          set -euo pipefail
          expected='ee8eb2d8b782af6c8e161b5a4671ca4d345cef06'
          echo 'PROBE_ITERATION=3'
          echo "EXPECTED_GIT_SHA=${expected}"
          echo '=== public cluster identity ==='
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS https://bonfirework.org/api/system/cluster
          echo
          echo '=== public readiness ==='
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS https://bonfirework.org/api/system/readiness
          echo
          echo '=== public health ==='
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS https://bonfirework.org/health
          echo
