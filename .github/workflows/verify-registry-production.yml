name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel older diagnostics on this branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel.txt
          for workflow in 321396252 339511072; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100" > /tmp/runs.json
            CURRENT_RUN_ID="$GITHUB_RUN_ID" python3 - <<'PY' >> /tmp/cancel.txt
          import json, os
          data=json.load(open('/tmp/runs.json'))
          current=int(os.environ['CURRENT_RUN_ID'])
          for r in data.get('workflow_runs',[]):
              if int(r.get('id',0)) != current and r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          done
          sort -u /tmp/cancel.txt -o /tmp/cancel.txt
          while read -r id; do
            [ -n "$id" ] || continue
            curl -fsS -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null || true
          done < /tmp/cancel.txt

  cloudflare-route-status:
    needs: cleanup-backlog
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 4
    steps:
      - name: Inspect Mac Cloudflare/Tunnel runtime without exposing arguments
        shell: bash
        run: |
          set -u
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo '=== cloudflared process ==='
          pgrep -x cloudflared >/tmp/cloudflared-pids 2>/dev/null || true
          while read -r pid; do [ -n "$pid" ] && ps -p "$pid" -o pid=,comm=; done </tmp/cloudflared-pids
          echo '=== launchd labels ==='
          launchctl list 2>/dev/null | awk 'tolower($0) ~ /cloudflare|cloudflared/ {print $1, $2, $3}' || true
          echo '=== docker tunnel containers ==='
          docker ps --format '{{.Names}}\t{{.Status}}\t{{.Image}}' | grep -Ei 'cloudflare|cloudflared|tunnel' || true
          echo '=== cloudflare-related service files (names only) ==='
          for dir in "$HOME/Library/LaunchAgents" /Library/LaunchAgents /Library/LaunchDaemons; do
            [ -d "$dir" ] && find "$dir" -maxdepth 1 -type f -iname '*cloud*' -print 2>/dev/null || true
          done
          echo '=== cloudflare credential variable names only ==='
          env | cut -d= -f1 | grep -Ei '^(CLOUDFLARE|CF_)' || true
          for f in /Users/peiyuan/Server/bonfirework/shared/.env.production /opt/warehouse-os/shared/.env.production; do
            if [ -f "$f" ]; then
              sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$f" | grep -Ei 'CLOUDFLARE|CF_' || true
            fi
          done
          echo '=== listeners ==='
          lsof -nP -iTCP -sTCP:LISTEN 2>/dev/null | grep -Ei 'cloudflared|nginx' || true
