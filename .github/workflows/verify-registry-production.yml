name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Force-cancel older diagnostics on this branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel.txt
          for workflow in 321396252 339511072; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100" > /tmp/runs.json
            CURRENT_RUN_ID="$GITHUB_RUN_ID" python3 - <<'PY' >> /tmp/cancel.txt
          import json, os
          data=json.load(open('/tmp/runs.json'))
          current=int(os.environ['CURRENT_RUN_ID'])
          for r in data.get('workflow_runs',[]):
              if int(r.get('id',0)) != current and r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          done
          sort -u /tmp/cancel.txt -o /tmp/cancel.txt
          while read -r id; do
            [ -n "$id" ] || continue
            echo "force-cancel temporary run ${id}"
            curl -fsS -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" >/dev/null || true
          done < /tmp/cancel.txt

  tunnel-config:
    needs: cleanup-backlog
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 4
    steps:
      - name: Read non-secret Cloudflare Tunnel routing and errors
        shell: bash
        run: |
          set -u
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo '=== launch agent routing metadata ==='
          python3 - <<'PY'
          import plistlib, pathlib
          for name in ('org.bonfirework.cloudflared.plist','org.bonfirework.cloudflared-pages.plist'):
              path=pathlib.Path.home()/'Library'/'LaunchAgents'/name
              if not path.exists(): continue
              p=plistlib.loads(path.read_bytes())
              print('label=', p.get('Label'))
              args=p.get('ProgramArguments') or []
              safe=[]; skip=False
              for a in args:
                  if skip: skip=False; continue
                  if a in {'--token','--credentials-file','--origincert'}:
                      safe.extend([a,'<redacted>']); skip=True; continue
                  if a.startswith('eyJ') or len(a)>120: safe.append('<redacted>'); continue
                  safe.append(a)
              print('args=', safe)
              print('stdout=', p.get('StandardOutPath'))
              print('stderr=', p.get('StandardErrorPath'))
          PY
          echo '=== ingress routes only ==='
          python3 - <<'PY'
          import plistlib, pathlib
          files=[]
          for name in ('org.bonfirework.cloudflared.plist','org.bonfirework.cloudflared-pages.plist'):
              pth=pathlib.Path.home()/'Library'/'LaunchAgents'/name
              if not pth.exists(): continue
              p=plistlib.loads(pth.read_bytes()); args=p.get('ProgramArguments') or []
              for i,a in enumerate(args[:-1]):
                  if a == '--config': files.append(pathlib.Path(args[i+1]).expanduser())
          for p in [pathlib.Path.home()/'.cloudflared/config.yml', pathlib.Path.home()/'.cloudflared/config.yaml', *files]:
              if p.exists():
                  print('config=', p)
                  for line in p.read_text(errors='ignore').splitlines():
                      s=line.strip()
                      if s.startswith('hostname:') or s.startswith('service:'): print(s)
          PY
          echo '=== cloudflared recent routing errors ==='
          python3 - <<'PY'
          import plistlib, pathlib
          seen=set()
          for name in ('org.bonfirework.cloudflared.plist','org.bonfirework.cloudflared-pages.plist'):
              pth=pathlib.Path.home()/'Library'/'LaunchAgents'/name
              if not pth.exists(): continue
              p=plistlib.loads(pth.read_bytes())
              for key in ('StandardErrorPath','StandardOutPath'):
                  raw=p.get(key)
                  if not raw or raw in seen: continue
                  seen.add(raw); f=pathlib.Path(raw).expanduser(); print('log=',f)
                  if f.exists():
                      for line in f.read_text(errors='ignore').splitlines()[-120:]:
                          low=line.lower()
                          if any(w in low for w in ('error','failed','refused','connect','origin','service')): print(line[:800])
          PY
