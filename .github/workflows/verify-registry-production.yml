name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Force-cancel older diagnostics on this branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel.txt
          for workflow in 321396252 339511072; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100" > /tmp/runs.json
            CURRENT_RUN_ID="$GITHUB_RUN_ID" python3 - <<'PY' >> /tmp/cancel.txt
          import json, os
          d=json.load(open('/tmp/runs.json')); current=int(os.environ['CURRENT_RUN_ID'])
          for r in d.get('workflow_runs',[]):
              if int(r.get('id',0)) != current and r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          done
          sort -u /tmp/cancel.txt -o /tmp/cancel.txt
          while read -r id; do
            [ -n "$id" ] || continue
            curl -fsS -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" >/dev/null || true
          done < /tmp/cancel.txt

  direct-container-route:
    needs: cleanup-backlog
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 4
    steps:
      - name: Test OrbStack container-direct origins read-only
        shell: bash
        run: |
          set -u
          export PATH="$HOME/.orbstack/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo '=== container network metadata ==='
          docker inspect bonfirework-mac-api --format '{{json .NetworkSettings.Networks}}' || true
          echo '=== host DNS candidates ==='
          for host in bonfirework-mac-api.orb.local bonfirework-mac-api; do
            echo "host=${host}"
            dscacheutil -q host -a name "$host" 2>/dev/null || true
            curl -v --connect-timeout 3 --max-time 8 "http://${host}:8080/health" -o /tmp/direct.out 2>&1 | tail -n 25 || true
            cat /tmp/direct.out 2>/dev/null || true; echo
          done
          echo '=== container IP candidates ==='
          docker inspect bonfirework-mac-api --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{"\n"}}{{end}}' | while read -r ip; do
            [ -n "$ip" ] || continue
            echo "ip=${ip}"
            curl -v --connect-timeout 3 --max-time 8 "http://${ip}:8080/health" -o /tmp/ip.out 2>&1 | tail -n 25 || true
            cat /tmp/ip.out 2>/dev/null || true; echo
          done
          echo '=== local HTTPS/Nginx candidates ==='
          for port in 443 80; do
            echo "port=${port}"
            if [ "$port" = 443 ]; then
              curl -k -v --connect-timeout 3 --max-time 8 --resolve bonfirework.org:443:127.0.0.1 https://bonfirework.org/health -o /tmp/local.out 2>&1 | tail -n 25 || true
            else
              curl -v --connect-timeout 3 --max-time 8 -H 'Host: bonfirework.org' http://127.0.0.1/health -o /tmp/local.out 2>&1 | tail -n 25 || true
            fi
            cat /tmp/local.out 2>/dev/null || true; echo
          done
