name: Verify Registry production rollout

on:
  pull_request:
    paths:
      - .github/workflows/verify-registry-production.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Force-cancel older diagnostics on this branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          : > /tmp/cancel.txt
          for workflow in 321396252 339511072; do
            curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${GITHUB_HEAD_REF}&event=pull_request&per_page=100" > /tmp/runs.json
            CURRENT_RUN_ID="$GITHUB_RUN_ID" python3 - <<'PY' >> /tmp/cancel.txt
          import json, os
          d=json.load(open('/tmp/runs.json')); current=int(os.environ['CURRENT_RUN_ID'])
          for r in d.get('workflow_runs',[]):
              if int(r.get('id',0)) != current and r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          done
          sort -u /tmp/cancel.txt -o /tmp/cancel.txt
          while read -r id; do
            [ -n "$id" ] || continue
            curl -fsS -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" >/dev/null || true
          done < /tmp/cancel.txt

  recreate-old-api:
    needs: cleanup-backlog
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 6
    steps:
      - name: Force-recreate current old API with existing production compose
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.orbstack/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          root="$HOME/Server/bonfirework"
          expected_release='20260817T025629Z-57c7a4d691a2-mac-primary-smart'
          expected_image="bonfirework-api-mac:${expected_release}"

          status="$(${root}/bin/warehouse-deploy status)"
          printf '%s\n' "$status"
          grep -Fq "release=${expected_release}" <<<"$status"
          current_image="$(docker inspect bonfirework-mac-api --format '{{.Config.Image}}')"
          [ "$current_image" = "$expected_image" ] || { echo "refusing recreate: current image=${current_image}" >&2; exit 1; }

          args=(-f "$root/compose.macos.yaml")
          [ ! -f "$root/state/compose.release.yaml" ] || args+=(-f "$root/state/compose.release.yaml")
          [ ! -f "$root/state/compose.shield.yaml" ] || args+=(-f "$root/state/compose.shield.yaml")

          rendered="$(docker compose "${args[@]}" config --format json)"
          rendered_image="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["api"]["image"])' <<<"$rendered")"
          [ "$rendered_image" = "$expected_image" ] || { echo "refusing recreate: rendered image=${rendered_image}" >&2; exit 1; }

          echo '=== force-recreate current old API ==='
          docker compose "${args[@]}" up -d --no-build --no-deps --force-recreate api

          for attempt in $(seq 1 60); do
            health="$(docker inspect bonfirework-mac-api --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' 2>/dev/null || true)"
            if [ "$health" = healthy ] && curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8081/health >/tmp/local-health.json 2>/dev/null; then
              echo "local_origin_recovered=true attempt=${attempt}"
              cat /tmp/local-health.json; echo
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "local_origin_recovered=false health=${health}" >&2
              docker ps --filter name=bonfirework-mac-api --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' >&2 || true
              exit 1
            fi
            sleep 1
          done

          echo '=== public Cloudflare health ==='
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 3 --max-time 8 https://bonfirework.org/health >/tmp/public-health.json 2>/dev/null; then
              echo "public_health_recovered=true attempt=${attempt}"
              cat /tmp/public-health.json; echo
              exit 0
            fi
            sleep 2
          done
          echo 'public_health_recovered=false after local recovery' >&2
          exit 2
