name: Registry read key bootstrap

on:
  pull_request:
    paths:
      - .github/workflows/registry-read-key-bootstrap.yml

permissions:
  contents: read
  actions: write

jobs:
  clear-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel Backend contract for this temporary branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          encoded="$(python3 - "${GITHUB_HEAD_REF}" <<'PY'
          import sys,urllib.parse
          print(urllib.parse.quote(sys.argv[1],safe=''))
          PY
          )"
          curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/backend-contract.yml/runs?branch=${encoded}&event=pull_request&per_page=100" > /tmp/runs.json
          python3 - <<'PY' > /tmp/cancel.txt
          import json
          for r in json.load(open('/tmp/runs.json')).get('workflow_runs',[]):
              if r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          while read -r id; do
            [ -n "$id" ] || continue
            curl -sS -o /dev/null -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" || true
          done < /tmp/cancel.txt

  generate:
    needs: clear-contract
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Generate repository-scoped read-only SSH identity
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          secret_dir="/Users/peiyuan/Server/bonfirework/secrets"
          private_key="${secret_dir}/registry-read-ed25519"
          public_key="${private_key}.pub"
          mkdir -p "${secret_dir}"
          chmod 700 "${secret_dir}"
          if [ ! -f "${private_key}" ]; then
            ssh-keygen -q -t ed25519 -N '' -C 'warehouse-registry-read@bonfirework' -f "${private_key}"
          fi
          chmod 600 "${private_key}"
          chmod 644 "${public_key}"
          test "$(stat -f '%Lp' "${private_key}")" = "600"
          fingerprint="$(ssh-keygen -lf "${public_key}" -E sha256 | awk '{print $2}')"
          echo "REGISTRY_DEPLOY_KEY_READY=true"
          echo "REGISTRY_DEPLOY_KEY_FINGERPRINT=${fingerprint}"
          echo 'REGISTRY_DEPLOY_PUBLIC_KEY_BEGIN'
          cat "${public_key}"
          echo 'REGISTRY_DEPLOY_PUBLIC_KEY_END'
          if [ -f "$HOME/.ssh/known_hosts" ] && ssh-keygen -F github.com -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
            echo 'GITHUB_KNOWN_HOST=ready'
          else
            echo 'GITHUB_KNOWN_HOST=missing'
          fi
