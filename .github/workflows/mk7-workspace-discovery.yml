name: MK7 IAM bootstrap discovery

on:
  pull_request:
    paths:
      - .github/workflows/mk7-workspace-discovery.yml

permissions:
  contents: read
  actions: write

jobs:
  clear-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel Backend contract runs for this temporary branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          encoded="$(python3 - "${GITHUB_HEAD_REF}" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=''))
          PY
          )"
          curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/backend-contract.yml/runs?branch=${encoded}&event=pull_request&per_page=100" > /tmp/runs.json
          python3 - <<'PY' > /tmp/cancel.txt
          import json
          for r in json.load(open('/tmp/runs.json')).get('workflow_runs', []):
              if r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          while read -r id; do
            [ -n "$id" ] || continue
            curl -sS -o /dev/null -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" || true
          done < /tmp/cancel.txt

  discover:
    needs: clear-contract
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Inspect IAM bootstrap constraints read-only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.orbstack/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          docker inspect bonfirework-mac-api >/dev/null
          docker exec -i bonfirework-mac-api python - <<'PY'
          from sqlalchemy import text
          from app.db.session import system_session

          targets = [('iam','users'),('iam','memberships'),('iam','membership_permission_overrides')]
          with system_session() as session:
              session.execute(text('SET TRANSACTION READ ONLY'))
              for schema, table in targets:
                  cols = session.execute(text("""
                      SELECT column_name,data_type,is_nullable,column_default
                      FROM information_schema.columns
                      WHERE table_schema=:schema AND table_name=:table
                      ORDER BY ordinal_position
                  """), {'schema':schema,'table':table}).all()
                  print(f'TABLE={schema}.{table}')
                  for name, dtype, nullable, default in cols:
                      if any(word in name.lower() for word in ('password','secret','token','hash')):
                          print(f'COLUMN={name};type={dtype};nullable={nullable};default=<sensitive-field>')
                      else:
                          print(f'COLUMN={name};type={dtype};nullable={nullable};default={default}')
              fks = session.execute(text("""
                  SELECT tc.table_schema,tc.table_name,kcu.column_name,
                         ccu.table_schema AS foreign_table_schema,
                         ccu.table_name AS foreign_table_name,
                         ccu.column_name AS foreign_column_name
                  FROM information_schema.table_constraints tc
                  JOIN information_schema.key_column_usage kcu
                    ON tc.constraint_name=kcu.constraint_name AND tc.table_schema=kcu.table_schema
                  JOIN information_schema.constraint_column_usage ccu
                    ON ccu.constraint_name=tc.constraint_name AND ccu.table_schema=tc.table_schema
                  WHERE tc.constraint_type='FOREIGN KEY'
                    AND tc.table_schema='iam'
                    AND tc.table_name IN ('memberships','membership_permission_overrides')
                  ORDER BY tc.table_name,kcu.column_name
              """)).all()
              for row in fks:
                  print('FK=' + '.'.join(str(x) for x in row))
          PY
