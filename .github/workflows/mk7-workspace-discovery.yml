name: MK7 tenant-scoped workspace inspection

on:
  pull_request:
    paths:
      - .github/workflows/mk7-workspace-discovery.yml

permissions:
  contents: read
  actions: write

jobs:
  clear-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel Backend contract runs for this temporary branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          encoded="$(python3 - "${GITHUB_HEAD_REF}" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=''))
          PY
          )"
          curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/backend-contract.yml/runs?branch=${encoded}&event=pull_request&per_page=100" > /tmp/runs.json
          python3 - <<'PY' > /tmp/cancel.txt
          import json
          for r in json.load(open('/tmp/runs.json')).get('workflow_runs', []):
              if r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          while read -r id; do
            [ -n "$id" ] || continue
            curl -sS -o /dev/null -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" || true
          done < /tmp/cancel.txt

  inspect:
    needs: clear-contract
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Inspect Bonfire MK7 state under tenant RLS
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.orbstack/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          docker exec -i bonfirework-mac-api python - <<'PY'
          import json
          from sqlalchemy import text
          from app.db.session import system_session, tenant_session

          with system_session() as session:
              tenant = session.execute(
                  text("SELECT id FROM iam.tenants WHERE slug='bonfire' AND status='active'")
              ).scalar_one()
              service_user = session.execute(
                  text("SELECT id,active FROM iam.users WHERE username='warehouse-registry-bootstrap'")
              ).mappings().one_or_none()

          with tenant_session(tenant) as session:
              session.execute(text('SET TRANSACTION READ ONLY'))
              rows = session.execute(text("""
                  SELECT a.asset_no,a.name AS asset_name,a.source_ref_type,a.source_ref_id,
                         a.status AS asset_status,w.id AS workspace_id,w.workspace_key,
                         w.status AS workspace_status,w.runtime_status,w.public_url,
                         w.active_deployment_id,w.created_at,w.updated_at
                  FROM digital_asset.workspaces w
                  JOIN digital_asset.assets a ON a.id=w.asset_id AND a.tenant_id=w.tenant_id
                  WHERE w.workspace_key='mk7-workspace'
                  ORDER BY w.updated_at DESC
              """)).mappings().all()
              print('MK7_WORKSPACE_MATCHES=' + str(len(rows)))
              for row in rows:
                  print('MK7_WORKSPACE=' + json.dumps({k:str(v) if v is not None else None for k,v in row.items()},ensure_ascii=False))

              assets = session.execute(text("""
                  SELECT a.id,a.asset_no,a.name,a.source_ref_type,a.source_ref_id,
                         a.status,a.created_at,a.updated_at,
                         EXISTS(SELECT 1 FROM digital_asset.workspaces w WHERE w.asset_id=a.id) AS has_workspace
                  FROM digital_asset.assets a
                  WHERE lower(a.name)='mk7'
                     OR a.source_ref_id='CPYMSU/registry:assets/mk7'
                  ORDER BY a.updated_at DESC
              """)).mappings().all()
              print('MK7_ASSET_MATCHES=' + str(len(assets)))
              for row in assets:
                  print('MK7_ASSET=' + json.dumps({k:str(v) if v is not None else None for k,v in row.items()},ensure_ascii=False))

              if service_user is not None:
                  membership = session.execute(text("""
                      SELECT active,role_level
                      FROM iam.memberships
                      WHERE user_id=:user_id
                  """), {'user_id': service_user['id']}).mappings().one_or_none()
              else:
                  membership = None
          print('BOOTSTRAP_IDENTITY_PRESENT=' + str(service_user is not None).lower())
          if service_user is not None:
              print('BOOTSTRAP_USER_ACTIVE=' + str(bool(service_user['active'])).lower())
          print('BOOTSTRAP_MEMBERSHIP_PRESENT=' + str(membership is not None).lower())
          if membership is not None:
              print('BOOTSTRAP_MEMBERSHIP_ACTIVE=' + str(bool(membership['active'])).lower())
              print('BOOTSTRAP_ROLE_LEVEL=' + str(membership['role_level']))
          PY
