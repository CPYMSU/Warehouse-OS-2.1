name: MK7 delegated key validation

on:
  pull_request:
    paths:
      - .github/workflows/mk7-workspace-discovery.yml

permissions:
  contents: read
  actions: write

jobs:
  clear-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel Backend contract runs for this temporary branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          encoded="$(python3 - "${GITHUB_HEAD_REF}" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=''))
          PY
          )"
          curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/backend-contract.yml/runs?branch=${encoded}&event=pull_request&per_page=100" > /tmp/runs.json
          python3 - <<'PY' > /tmp/cancel.txt
          import json
          for r in json.load(open('/tmp/runs.json')).get('workflow_runs', []):
              if r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          while read -r id; do
            [ -n "$id" ] || continue
            curl -sS -o /dev/null -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" || true
          done < /tmp/cancel.txt

  validate:
    needs: clear-contract
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Validate local delegated key and read-only Workspace API
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          secret_dir="/Users/peiyuan/Server/bonfirework/secrets"
          secret_file="${secret_dir}/digital-asset-workspace-keys.json"
          test -d "${secret_dir}"
          test "$(stat -f '%Lp' "${secret_dir}")" = "700"
          test -f "${secret_file}"
          test "$(stat -f '%Lp' "${secret_file}")" = "600"
          key="$(python3 - "${secret_file}" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          key=str(value.get('mk7') or '')
          if not key.startswith('wak_'):
              raise SystemExit('mk7 key is missing or malformed')
          print(key,end='')
          PY
          )"
          test -n "${key}"
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsS \
            -H "Authorization: Bearer ${key}" \
            https://bonfirework.org/api/workspaces/v1/info > "${RUNNER_TEMP}/mk7-info.json"
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsS \
            -H "Authorization: Bearer ${key}" \
            https://bonfirework.org/api/workspaces/v1/sources > "${RUNNER_TEMP}/mk7-sources.json"
          unset key
          python3 - "${RUNNER_TEMP}/mk7-info.json" "${RUNNER_TEMP}/mk7-sources.json" <<'PY'
          import json,sys
          info=json.load(open(sys.argv[1],encoding='utf-8'))
          sources=json.load(open(sys.argv[2],encoding='utf-8'))
          text=json.dumps(info,ensure_ascii=False)
          if 'mk7-workspace' not in text:
              raise SystemExit('delegated key did not resolve to mk7-workspace')
          count=len(sources.get('sources',[])) if isinstance(sources,dict) else 0
          print('MK7_DELEGATED_KEY_VALID=true')
          print('MK7_WORKSPACE_MATCH=true')
          print('MK7_LOCAL_SECRET_DIR_MODE=700')
          print('MK7_LOCAL_SECRET_FILE_MODE=600')
          print('MK7_EXISTING_SOURCE_COUNT='+str(count))
          PY
