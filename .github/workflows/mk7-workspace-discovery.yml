name: MK7 workspace discovery

on:
  pull_request:
    paths:
      - .github/workflows/mk7-workspace-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Discover MK7 workspace metadata read-only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.orbstack/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          docker inspect bonfirework-mac-api >/dev/null
          docker exec -i bonfirework-mac-api python - <<'PY'
          from sqlalchemy import text
          from app.db.session import system_session

          blocked = ('secret','password','token','hash','credential','key_material')
          with system_session() as session:
              session.execute(text("SET TRANSACTION READ ONLY"))
              rows = session.execute(text("""
                  SELECT table_schema, table_name
                  FROM information_schema.tables
                  WHERE table_type='BASE TABLE'
                    AND table_schema NOT IN ('pg_catalog','information_schema')
                  ORDER BY table_schema, table_name
              """)).all()
              print('TABLE_COUNT=' + str(len(rows)))
              for schema, table in rows:
                  if not any(word in table.lower() for word in ('asset','workspace','tenant','company','organization','source','deployment')):
                      continue
                  cols = session.execute(text("""
                      SELECT column_name
                      FROM information_schema.columns
                      WHERE table_schema=:schema AND table_name=:table
                      ORDER BY ordinal_position
                  """), {'schema': schema, 'table': table}).scalars().all()
                  public_cols = [c for c in cols if not any(x in c.lower() for x in blocked)]
                  print(f'TABLE {schema}.{table}=' + ','.join(public_cols))
          PY
