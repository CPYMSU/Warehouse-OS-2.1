name: MK7 registry read validation

on:
  pull_request:
    paths:
      - .github/workflows/mk7-workspace-discovery.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Validate local MK7 key and private Registry read path
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          secret_file="/Users/peiyuan/Server/bonfirework/secrets/digital-asset-workspace-keys.json"
          test -f "$secret_file"
          test "$(stat -f '%Lp' "$secret_file")" = "600"
          python3 - "$secret_file" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          key=str(value.get('mk7') or '')
          if not key.startswith('wak_'):
              raise SystemExit('mk7 delegated key missing')
          print('MK7_LOCAL_KEY_PRESENT=true')
          PY

          export GIT_TERMINAL_PROMPT=0
          if git ls-remote https://github.com/CPYMSU/registry.git refs/heads/main >/dev/null 2>&1; then
            echo 'REGISTRY_HTTPS_READ_WITH_EXISTING_CREDENTIALS=true'
          else
            echo 'REGISTRY_HTTPS_READ_WITH_EXISTING_CREDENTIALS=false'
          fi

          if command -v gh >/dev/null 2>&1 && gh auth status >/dev/null 2>&1; then
            echo 'GH_AUTH_AVAILABLE=true'
            gh auth setup-git >/dev/null 2>&1 || true
            if git ls-remote https://github.com/CPYMSU/registry.git refs/heads/main >/dev/null 2>&1; then
              echo 'REGISTRY_HTTPS_READ_AFTER_GH_SETUP=true'
            else
              echo 'REGISTRY_HTTPS_READ_AFTER_GH_SETUP=false'
            fi
          else
            echo 'GH_AUTH_AVAILABLE=false'
          fi
