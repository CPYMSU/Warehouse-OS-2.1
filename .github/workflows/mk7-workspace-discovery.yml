name: MK7 workspace manager discovery

on:
  pull_request:
    paths:
      - .github/workflows/mk7-workspace-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Discover authorized digital asset managers read-only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.orbstack/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          docker inspect bonfirework-mac-api >/dev/null
          docker exec -i bonfirework-mac-api python - <<'PY'
          from sqlalchemy import text
          from app.api.deps import _load_actor
          from app.db.session import system_session

          with system_session() as session:
              tenants = session.execute(text("""
                  SELECT id, slug
                  FROM iam.tenants
                  WHERE status='active'
                  ORDER BY slug
              """)).all()

          bonfire_count = 0
          bonfire_max_role = 0
          manage_tenants = []
          for tenant_id, slug in tenants:
              with system_session() as session:
                  user_ids = session.execute(text("""
                      SELECT user_id
                      FROM iam.memberships
                      WHERE tenant_id=:tenant_id AND active
                      ORDER BY role_level DESC, created_at
                  """), {'tenant_id': tenant_id}).scalars().all()
              count = 0
              max_role = 0
              for user_id in user_ids:
                  try:
                      actor = _load_actor(user_id, tenant_id)
                  except Exception:
                      continue
                  max_role = max(max_role, int(actor.role_level))
                  if actor.role_level >= 10 or {'assets.manage','asset_mgmt.manage'}.intersection(actor.permissions):
                      count += 1
              if slug == 'bonfire':
                  bonfire_count = count
                  bonfire_max_role = max_role
                  print('BONFIRE_ACTIVE_MEMBERS=' + str(len(user_ids)))
                  print('BONFIRE_MAX_ROLE_LEVEL=' + str(max_role))
                  print('BONFIRE_ASSET_MANAGERS=' + str(count))
              if count:
                  manage_tenants.append((slug, count, max_role))

          print('TENANTS_WITH_ASSET_MANAGERS=' + str(len(manage_tenants)))
          for slug, count, max_role in manage_tenants:
              print(f'MANAGE_TENANT={slug};count={count};max_role={max_role}')
          PY
