name: MK7 workspace discovery

on:
  pull_request:
    paths:
      - .github/workflows/mk7-workspace-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Inventory current Warehouse workspaces read-only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.orbstack/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          docker inspect bonfirework-mac-api >/dev/null
          docker exec -i bonfirework-mac-api python - <<'PY'
          import json
          from sqlalchemy import text
          from app.db.session import system_session

          with system_session() as session:
              session.execute(text("SET TRANSACTION READ ONLY"))
              counts = session.execute(text("""
                  SELECT t.id, t.slug, t.name,
                         count(DISTINCT a.id) AS asset_count,
                         count(DISTINCT w.id) AS workspace_count
                  FROM iam.tenants t
                  LEFT JOIN digital_asset.assets a ON a.tenant_id=t.id
                  LEFT JOIN digital_asset.workspaces w ON w.tenant_id=t.id
                  GROUP BY t.id,t.slug,t.name
                  ORDER BY workspace_count DESC, asset_count DESC, t.slug
              """)).mappings().all()
              print('TENANT_COUNT=' + str(len(counts)))
              for row in counts:
                  print('TENANT=' + json.dumps({k:str(v) if v is not None else None for k,v in row.items()}, ensure_ascii=False))

              rows = session.execute(text("""
                  SELECT
                    t.slug AS tenant_slug,
                    a.asset_no,
                    a.name AS asset_name,
                    a.asset_kind,
                    a.status AS asset_status,
                    w.id AS workspace_id,
                    w.workspace_key,
                    w.status AS workspace_status,
                    w.runtime_status,
                    w.public_url,
                    w.active_deployment_id,
                    w.hosting_mode,
                    w.compute_node,
                    w.created_at,
                    w.updated_at
                  FROM digital_asset.workspaces w
                  JOIN digital_asset.assets a ON a.id=w.asset_id AND a.tenant_id=w.tenant_id
                  JOIN iam.tenants t ON t.id=w.tenant_id
                  ORDER BY w.updated_at DESC
                  LIMIT 200
              """)).mappings().all()
              print('WORKSPACE_COUNT=' + str(len(rows)))
              for row in rows:
                  print('WORKSPACE=' + json.dumps({k:str(v) if v is not None else None for k,v in row.items()}, ensure_ascii=False))
          PY
