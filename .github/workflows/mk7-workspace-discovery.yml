name: MK7 workspace discovery

on:
  pull_request:
    paths:
      - .github/workflows/mk7-workspace-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Locate MK7 workspace metadata without reading secrets
        shell: bash
        run: |
          set -euo pipefail
          needle='postgresql_site_0fd9585fde15629e'
          echo '=== matching paths ==='
          for root in /Users/peiyuan/Server/bonfirework/shared /mnt/warehouse-data/hosted; do
            [ -d "$root" ] || continue
            find "$root" -maxdepth 8 \
              \( -type f -o -type d \) \
              ! -name '.env*' \
              ! -iname '*secret*' \
              ! -iname '*credential*' \
              ! -iname '*key*' \
              \( -iname "*${needle}*" -o -iname '*mk7*' \) \
              -print 2>/dev/null | sed -n '1,160p'
          done

          echo '=== safe manifest references ==='
          for root in /Users/peiyuan/Server/bonfirework/shared /mnt/warehouse-data/hosted; do
            [ -d "$root" ] || continue
            find "$root" -maxdepth 8 -type f \
              \( -name '*.json' -o -name '*.manifest' -o -name '*.txt' -o -name '*.md' \) \
              ! -name '.env*' \
              ! -iname '*secret*' \
              ! -iname '*credential*' \
              ! -iname '*key*' \
              -size -2M -print0 2>/dev/null |
            while IFS= read -r -d '' file; do
              if grep -qiE "${needle}|mk7" "$file" 2>/dev/null; then
                printf 'file=%s\n' "$file"
                grep -iE 'workspace|workspace_key|tenant|slug|asset|release_id|site|mk7|postgresql_site' "$file" 2>/dev/null | sed -n '1,30p' || true
              fi
            done
          done
