name: MK7 Registry adoption

on:
  pull_request:
    paths:
      - .github/workflows/mk7-workspace-discovery.yml

permissions:
  contents: read
  actions: write

jobs:
  clear-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel Backend contract runs for this temporary branch
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          encoded="$(python3 - "${GITHUB_HEAD_REF}" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=''))
          PY
          )"
          curl -fsS "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/backend-contract.yml/runs?branch=${encoded}&event=pull_request&per_page=100" > /tmp/runs.json
          python3 - <<'PY' > /tmp/cancel.txt
          import json
          for r in json.load(open('/tmp/runs.json')).get('workflow_runs', []):
              if r.get('status') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['id'])
          PY
          while read -r id; do
            [ -n "$id" ] || continue
            curl -sS -o /dev/null -X POST "${auth[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" || true
          done < /tmp/cancel.txt

  adopt:
    needs: clear-contract
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 8
    steps:
      - name: Adopt existing MK7 workspace and issue publisher key
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.orbstack/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          docker inspect bonfirework-mac-api >/dev/null
          result_file="${RUNNER_TEMP}/mk7-adopt-result.json"
          secret_dir="/Users/peiyuan/Server/bonfirework/secrets"
          secret_file="${secret_dir}/digital-asset-workspace-keys.json"
          rm -f "${result_file}"
          umask 077

          docker exec -i bonfirework-mac-api python - >"${result_file}" <<'PY'
          import json
          import secrets
          from sqlalchemy import text
          from app.api.deps import _load_actor
          from app.core.config import get_settings
          from app.core.security import hash_password
          from app.db.session import system_session, tenant_session
          from app.services.digital_asset_hosting import _audit, issue_workspace_key

          tenant_slug = 'bonfire'
          username = 'warehouse-registry-bootstrap'
          source_ref_id = 'CPYMSU/registry:assets/mk7'
          allow_keys = ['asset_mgmt.manage', 'assets.manage']
          settings = get_settings()

          with system_session() as session:
              tenant = session.execute(
                  text("SELECT id FROM iam.tenants WHERE slug=:slug AND status='active'"),
                  {'slug': tenant_slug},
              ).scalar_one()
              service_user = session.execute(
                  text("SELECT id FROM iam.users WHERE username=:username"),
                  {'username': username},
              ).scalar_one()
              session.execute(text("""
                  UPDATE iam.users
                  SET password_hash=:password_hash,active=true,is_platform_owner=false,updated_at=now()
                  WHERE id=:id
              """), {
                  'id': service_user,
                  'password_hash': hash_password(secrets.token_urlsafe(72)),
              })

          try:
              with tenant_session(tenant) as session:
                  session.execute(text("""
                      INSERT INTO iam.memberships(
                        tenant_id,user_id,active,role_level,topology_level,topology_title
                      ) VALUES (:tenant_id,:user_id,true,1,1,'Automation bootstrap')
                      ON CONFLICT (tenant_id,user_id) DO UPDATE SET
                        active=true,role_level=1,topology_level=1,
                        topology_title='Automation bootstrap',updated_at=now()
                  """), {'tenant_id': tenant, 'user_id': service_user})
                  session.execute(text("""
                      INSERT INTO iam.membership_permission_overrides(
                        tenant_id,user_id,allow_keys,deny_keys
                      ) VALUES (:tenant_id,:user_id,CAST(:allow_keys AS jsonb),'[]'::jsonb)
                      ON CONFLICT (tenant_id,user_id) DO UPDATE SET
                        allow_keys=EXCLUDED.allow_keys,deny_keys='[]'::jsonb,updated_at=now()
                  """), {
                      'tenant_id': tenant,
                      'user_id': service_user,
                      'allow_keys': json.dumps(allow_keys),
                  })
                  _audit(
                      session,None,'system.registry_bootstrap_identity_enabled',
                      {'purpose':'mk7_registry_adoption','role_level':1,'permissions':allow_keys},
                      tenant_id=tenant,
                  )

              actor = _load_actor(service_user, tenant)
              if actor.role_level != 1 or not {'asset_mgmt.manage','assets.manage'}.intersection(actor.permissions):
                  raise RuntimeError('Bootstrap identity authority is broader or narrower than expected')

              with tenant_session(tenant) as session:
                  target = session.execute(text("""
                      SELECT a.id AS asset_id,a.asset_no,a.name,w.id AS workspace_id,
                             w.workspace_key,w.active_deployment_id,w.runtime_status
                      FROM digital_asset.workspaces w
                      JOIN digital_asset.assets a ON a.id=w.asset_id AND a.tenant_id=w.tenant_id
                      WHERE w.workspace_key='mk7-workspace'
                      FOR UPDATE OF a,w
                  """)).mappings().one_or_none()
                  if target is None:
                      raise RuntimeError('Existing mk7-workspace disappeared before adoption')
                  if str(target['name']).strip().casefold() != 'mk7':
                      raise RuntimeError('mk7-workspace belongs to an unrelated asset')

                  duplicates = session.execute(text("""
                      SELECT a.id,a.asset_no
                      FROM digital_asset.assets a
                      WHERE a.id<>:target_id
                        AND (lower(a.name)='mk7' OR a.source_ref_id=:source_ref_id)
                        AND NOT EXISTS(
                          SELECT 1 FROM digital_asset.workspaces w WHERE w.asset_id=a.id
                        )
                      FOR UPDATE
                  """), {
                      'target_id': target['asset_id'],
                      'source_ref_id': source_ref_id,
                  }).mappings().all()
                  for duplicate in duplicates:
                      session.execute(text("""
                          UPDATE digital_asset.assets
                          SET status='archived',lifecycle_stage='retired',
                              source_ref_id=CASE
                                WHEN source_ref_id=:source_ref_id
                                THEN :source_ref_id || ':superseded:' || asset_no
                                ELSE source_ref_id
                              END,
                              metadata=COALESCE(metadata,'{}'::jsonb) || CAST(:metadata AS jsonb),
                              updated_at=now()
                          WHERE id=:id
                      """), {
                          'id': duplicate['id'],
                          'source_ref_id': source_ref_id,
                          'metadata': json.dumps({
                              'superseded_by_workspace': 'mk7-workspace',
                              'superseded_reason': 'duplicate_registry_adoption_record',
                          }),
                      })
                      _audit(
                          session,actor,'digital_asset.asset.duplicate_archived',
                          {'asset_no':str(duplicate['asset_no']),'superseded_by':str(target['asset_no'])},
                      )

                  session.execute(text("""
                      UPDATE digital_asset.assets
                      SET source_module='github',
                          source_ref_type='git_repository_subtree',
                          source_ref_id=:source_ref_id,
                          metadata=COALESCE(metadata,'{}'::jsonb) || CAST(:metadata AS jsonb),
                          updated_at=now()
                      WHERE id=:asset_id
                  """), {
                      'asset_id': target['asset_id'],
                      'source_ref_id': source_ref_id,
                      'metadata': json.dumps({
                          'repository': 'CPYMSU/registry',
                          'source_path': 'assets/mk7',
                          'registry_workspace_key_ref': 'mk7',
                          'imported_source_sha256': '32ef40976c7038e5e55ca9a7dbf844666386a7663f0da0be87265ce96a36bcb4',
                      }),
                  })
                  _audit(
                      session,actor,'digital_asset.asset.registry_source_adopted',
                      {
                          'asset_no':str(target['asset_no']),
                          'workspace_key':'mk7-workspace',
                          'repository':'CPYMSU/registry',
                          'source_path':'assets/mk7',
                      },
                  )
                  workspace_id = target['workspace_id']
                  primary_exists = session.execute(text("""
                      SELECT id FROM digital_asset.api_credentials
                      WHERE workspace_id=:workspace_id AND key_kind='primary'
                        AND revoked_at IS NULL
                        AND (expires_at IS NULL OR expires_at>now())
                      ORDER BY issued_at DESC LIMIT 1
                  """), {'workspace_id':workspace_id}).scalar_one_or_none()

              if primary_exists is None:
                  primary = issue_workspace_key(
                      actor,workspace_id,
                      {'label':'Registry bootstrap primary','expires_days':365},
                      signing_secret=settings.integration_secret,
                      key_kind='primary',
                  )
                  primary.pop('api_key',None)

              delegated = issue_workspace_key(
                  actor,workspace_id,
                  {
                      'label':'GitHub Registry Publisher',
                      'expires_days':365,
                      'scopes':['workspace:read','deploy:read','deploy:write'],
                  },
                  signing_secret=settings.integration_secret,
              )
              api_key = str(delegated['api_key'])
              if not api_key.startswith('wak_'):
                  raise RuntimeError('Delegated workspace key has an unexpected format')
              print(json.dumps({
                  'api_key':api_key,
                  'credential_id':str(delegated['credential_id']),
                  'asset_no':str(target['asset_no']),
                  'workspace_key':'mk7-workspace',
                  'active_deployment_id':str(target['active_deployment_id']) if target['active_deployment_id'] else None,
                  'runtime_status':str(target['runtime_status']),
                  'duplicate_archived_count':len(duplicates),
              },ensure_ascii=False))
          finally:
              with tenant_session(tenant) as session:
                  session.execute(text("""
                      UPDATE iam.memberships SET active=false,updated_at=now()
                      WHERE tenant_id=:tenant_id AND user_id=:user_id
                  """), {'tenant_id':tenant,'user_id':service_user})
                  _audit(
                      session,None,'system.registry_bootstrap_identity_disabled',
                      {'purpose':'mk7_registry_adoption'},tenant_id=tenant,
                  )
              with system_session() as session:
                  session.execute(text("""
                      UPDATE iam.users SET active=false,updated_at=now() WHERE id=:id
                  """), {'id':service_user})
          PY

          mkdir -p "${secret_dir}"
          chmod 700 "${secret_dir}"
          python3 - "${result_file}" "${secret_file}" <<'PY'
          import json,os,sys,tempfile
          result_path,secret_path=sys.argv[1:]
          result=json.load(open(result_path,encoding='utf-8'))
          key=str(result.pop('api_key'))
          if not key.startswith('wak_'):
              raise SystemExit('Invalid workspace key; refusing to persist')
          values={}
          if os.path.exists(secret_path):
              with open(secret_path,encoding='utf-8') as handle:
                  current=json.load(handle)
                  if isinstance(current,dict): values=current
          values['mk7']=key
          directory=os.path.dirname(secret_path)
          fd,tmp=tempfile.mkstemp(prefix='.workspace-keys.',dir=directory,text=True)
          try:
              os.fchmod(fd,0o600)
              with os.fdopen(fd,'w',encoding='utf-8') as handle:
                  json.dump(values,handle,ensure_ascii=False,separators=(',',':'))
                  handle.write('\n')
              os.replace(tmp,secret_path)
              os.chmod(secret_path,0o600)
          finally:
              if os.path.exists(tmp): os.unlink(tmp)
          print('MK7_ASSET_NO='+result['asset_no'])
          print('MK7_WORKSPACE_KEY='+result['workspace_key'])
          print('MK7_RUNTIME_STATUS='+result['runtime_status'])
          print('MK7_EXISTING_DEPLOYMENT_PRESERVED='+str(bool(result['active_deployment_id'])).lower())
          print('MK7_DUPLICATE_ARCHIVED_COUNT='+str(result['duplicate_archived_count']))
          print('MK7_DELEGATED_KEY_STORED_LOCAL=true')
          print('MK7_BOOTSTRAP_IDENTITY_DISABLED=true')
          PY
          rm -f "${result_file}"

      - name: Probe SSH read access to private Registry
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          known_hosts="${RUNNER_TEMP}/github-known-hosts"
          : > "${known_hosts}"
          if GIT_SSH_COMMAND="ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=no -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${known_hosts} -o ConnectTimeout=10" \
             git ls-remote git@github.com:CPYMSU/registry.git HEAD >/tmp/registry-ls-remote.out 2>/dev/null; then
            test -s /tmp/registry-ls-remote.out
            echo 'REGISTRY_SSH_READ=ready'
          else
            echo 'REGISTRY_SSH_READ=unavailable'
          fi
