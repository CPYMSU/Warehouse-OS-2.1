name: Registry deploy key bootstrap

on:
  pull_request:
    paths:
      - .github/workflows/mk7-workspace-discovery.yml

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Create or reuse read-only Registry deploy key
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          secret_dir="/Users/peiyuan/Server/bonfirework/secrets"
          private_key="${secret_dir}/registry-readonly-ed25519"
          public_key="${private_key}.pub"
          install -d -m 700 "$secret_dir"
          if [ ! -f "$private_key" ]; then
            ssh-keygen -q -t ed25519 -N '' -C 'warehouse-registry-readonly' -f "$private_key"
          fi
          chmod 600 "$private_key"
          chmod 644 "$public_key"
          test "$(stat -f '%Lp' "$private_key")" = "600"
          echo 'REGISTRY_DEPLOY_KEY_READY=true'
          echo 'REGISTRY_DEPLOY_PUBLIC_KEY_BEGIN'
          cat "$public_key"
          echo 'REGISTRY_DEPLOY_PUBLIC_KEY_END'
