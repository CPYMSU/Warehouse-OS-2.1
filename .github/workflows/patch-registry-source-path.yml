name: Patch registry source path support

on:
  pull_request:
    paths:
      - .github/workflows/patch-registry-source-path.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Add source_path-aware publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ops/macos/publish-digital-assets.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'from pathlib import Path\n',
              'from pathlib import Path, PurePosixPath\n',
          )
          replace_once(
              '''        repository = str(item.get("repository") or "").strip()\n        if not REPOSITORY_RE.fullmatch(repository):\n            raise RuntimeError(f"link #{index + 1} has an invalid repository: {repository!r}")\n        workspace_key = str(item.get("workspace_key") or "").strip()\n''',
              '''        repository = str(item.get("repository") or "").strip()\n        if not REPOSITORY_RE.fullmatch(repository):\n            raise RuntimeError(f"link #{index + 1} has an invalid repository: {repository!r}")\n        source_path = str(item.get("source_path") or "").strip().strip("/")\n        if source_path:\n            parsed_source = PurePosixPath(source_path)\n            if parsed_source.is_absolute() or ".." in parsed_source.parts:\n                raise RuntimeError(f"link {repository} has unsafe source_path={source_path!r}")\n        workspace_key = str(item.get("workspace_key") or "").strip()\n''',
          )
          replace_once(
              '''                "repository": repository,\n                "ref": str(item.get("ref") or "main").strip(),\n                "workspace_key": workspace_key,\n''',
              '''                "repository": repository,\n                "ref": str(item.get("ref") or "main").strip(),\n                "source_path": source_path,\n                "workspace_key": workspace_key,\n''',
          )
          replace_once('def _find_source_for_commit(\n', 'def _find_source_for_version(\n')
          replace_once(
              '''    commit: str,\n) -> str | None:\n''',
              '''    version_no: str,\n) -> str | None:\n''',
          )
          replace_once(
              '''        if str(item.get("version_no") or "") != commit:\n''',
              '''        if str(item.get("version_no") or "") != version_no:\n''',
          )
          replace_once(
              '''    checkout: Path,\n    commit: str,\n    component: str,\n) -> str:\n    archive = checkout.parent / f"{commit}.tar.gz"\n    _run(\n        ["git", "archive", "--format=tar.gz", f"--output={archive}", commit],\n        cwd=checkout,\n        timeout=300,\n    )\n''',
              '''    checkout: Path,\n    commit: str,\n    component: str,\n    source_path: str,\n    version_no: str,\n) -> str:\n    archive = checkout.parent / f"{version_no}.tar.gz"\n    treeish = commit\n    if source_path:\n        source_root = (checkout / source_path).resolve()\n        try:\n            source_root.relative_to(checkout.resolve())\n        except ValueError as exc:\n            raise RuntimeError(f"source_path escaped checkout: {source_path!r}") from exc\n        if not source_root.is_dir():\n            raise RuntimeError(f"source_path does not exist: {source_path!r}")\n        treeish = f"{commit}:{source_path}"\n    _run(\n        ["git", "archive", "--format=tar.gz", f"--output={archive}", treeish],\n        cwd=checkout,\n        timeout=300,\n    )\n''',
          )
          replace_once(
              '''        "--version",\n        commit,\n''',
              '''        "--version",\n        version_no,\n''',
          )
          replace_once(
              '''    repository: str,\n    commit: str,\n    source_id: str,\n''',
              '''    repository: str,\n    source_path: str,\n    commit: str,\n    source_id: str,\n''',
          )
          replace_once(
              '''            f"{repository}:{commit}:{runtime_type}:{component}".encode("utf-8")\n''',
              '''            f"{repository}:{source_path}:{commit}:{runtime_type}:{component}".encode("utf-8")\n''',
          )
          replace_once(
              '''    repository = link["repository"]\n    ref = link["ref"]\n    checkout = temp_root / repository.replace("/", "__")\n''',
              '''    repository = link["repository"]\n    ref = link["ref"]\n    source_path = str(link.get("source_path") or "")\n    checkout = temp_root / repository.replace("/", "__")\n''',
          )
          replace_once(
              '''    workspace_env = _workspace_environment(base_url, link["workspace_key"])\n    source_id = _find_source_for_commit(python, cli, workspace_env, commit)\n    source_reused = source_id is not None\n''',
              '''    version_no = (\n        commit\n        if not source_path\n        else f"{commit}-{hashlib.sha256(source_path.encode('utf-8')).hexdigest()[:12]}"\n    )\n    workspace_env = _workspace_environment(base_url, link["workspace_key"])\n    source_id = _find_source_for_version(python, cli, workspace_env, version_no)\n    source_reused = source_id is not None\n''',
          )
          replace_once(
              '''            commit,\n            link["component"],\n        )\n''',
              '''            commit,\n            link["component"],\n            source_path,\n            version_no,\n        )\n''',
          )
          replace_once(
              '''        repository=repository,\n        commit=commit,\n''',
              '''        repository=repository,\n        source_path=source_path,\n        commit=commit,\n''',
          )
          replace_once(
              '''        "repository": repository,\n        "ref": ref,\n        "commit": commit,\n''',
              '''        "repository": repository,\n        "ref": ref,\n        "source_path": source_path,\n        "commit": commit,\n        "source_version": version_no,\n''',
          )

          path.write_text(text, encoding='utf-8')

          doc = Path('docs/github-digital-asset-publishing.md')
          doc_text = doc.read_text(encoding='utf-8')
          doc_text = doc_text.replace(
              '- `ref`: branch or tag to follow.\n',
              '- `ref`: branch or tag to follow.\n- `source_path`: optional repository-relative subtree, for example `assets/mk7`; only that subtree is archived as the asset source.\n',
          )
          doc_text = doc_text.replace(
              '1. shallow-clones the configured source ref on the Mac mini;\n',
              '1. shallow-clones the configured source ref on the Mac mini and, when `source_path` is set, selects only that subtree;\n',
          )
          doc.write_text(doc_text, encoding='utf-8')
          PY

          python3 -m compileall -q ops/macos/publish-digital-assets.py
          git diff --check
          git config user.name 'Warehouse Registry Publisher Patch'
          git config user.email 'noreply@bonfirework.org'
          git add -- ops/macos/publish-digital-assets.py docs/github-digital-asset-publishing.md
          git commit -m 'Support registry source subdirectories'
          for delay in 0 5 15 30; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if git push origin "HEAD:${GITHUB_HEAD_REF}"; then exit 0; fi
          done
          exit 1
