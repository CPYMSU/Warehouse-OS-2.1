name: Digital asset publish

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: Optional owner/repository to publish; blank checks every linked asset
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: warehouse-digital-asset-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 180
    env:
      WAREHOUSE_BASE_URL: ${{ vars.WAREHOUSE_BASE_URL || 'https://bonfirework.org' }}
      WAREHOUSE_ASSET_LINKS_JSON: ${{ secrets.WAREHOUSE_ASSET_LINKS_JSON }}
      WAREHOUSE_ASSET_GITHUB_TOKEN: ${{ secrets.WAREHOUSE_ASSET_GITHUB_TOKEN }}
      WAREHOUSE_ASSET_REPOSITORY: ${{ inputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish governed digital-asset releases
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          python3 ops/macos/publish-digital-assets.py
