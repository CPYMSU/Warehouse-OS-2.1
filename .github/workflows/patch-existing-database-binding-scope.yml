name: Patch existing database binding scope

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-existing-database-binding-scope.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warehouse-existing-database-binding-scope-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allow deploy keys to reuse an unchanged managed database binding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/app/services/workspace_deployments.py")
          text = path.read_text(encoding="utf-8")
          marker = "reuses_existing_database_binding"

          if marker not in text:
              lines = text.splitlines()

              runtime_start = next(
                  i for i, line in enumerate(lines)
                  if line.strip() == "runtime_intent = {"
                  and i + 1 < len(lines)
                  and "component.get(\"config\")" in lines[i + 1]
              )
              runtime_end = next(
                  i for i in range(runtime_start + 1, len(lines))
                  if lines[i].strip() == "}"
              )
              indent = lines[runtime_start][:-len(lines[runtime_start].lstrip())]
              lines[runtime_start:runtime_end + 1] = [
                  indent + "component_config = (",
                  indent + "    component.get(\"config\") if isinstance(component.get(\"config\"), dict) else {}",
                  indent + ")",
                  indent + "runtime_intent = {",
                  indent + "    **component_config,",
                  indent + "    **manifest_defaults,",
                  indent + "    **{key: value for key, value in payload.items() if value not in (None, \"\")},",
                  indent + "}",
              ]

              alias_start = next(
                  i for i, line in enumerate(lines)
                  if line.strip() == "database_url_env = str(runtime_intent.get(\"database_url_env\") or \"\").strip()"
              )
              alias_end = next(
                  i for i in range(alias_start + 1, len(lines))
                  if lines[i].strip() == "database_access = str("
              )
              indent = lines[alias_start][:-len(lines[alias_start].lstrip())]
              lines[alias_start:alias_end] = [
                  indent + "existing_database_url_env = str(",
                  indent + "    component_config.get(\"database_url_env\") or \"\"",
                  indent + ").strip()",
                  indent + "database_url_env = str(runtime_intent.get(\"database_url_env\") or \"\").strip()",
                  indent + "if database_url_env and not re.fullmatch(r\"[A-Z][A-Z0-9_]{0,79}\", database_url_env):",
                  indent + "    raise HTTPException(",
                  indent + "        status_code=422,",
                  indent + "        detail=\"database_url_env must be a safe env name\",",
                  indent + "    )",
              ]

              lifecycle_index = next(
                  i for i, line in enumerate(lines)
                  if line.strip() == "lifecycle_job = runtime_intent.get(\"lifecycle_job\")"
              )
              indent = lines[lifecycle_index][:-len(lines[lifecycle_index].lstrip())]
              scope_gate = [
                  indent + "existing_database_access = str(",
                  indent + "    component_config.get(\"database_access\")",
                  indent + "    or (\"runtime\" if existing_database_url_env else \"none\")",
                  indent + ").strip().lower()",
                  indent + "reuses_existing_database_binding = bool(",
                  indent + "    database_url_env",
                  indent + "    and database_url_env == existing_database_url_env",
                  indent + "    and database_access == existing_database_access",
                  indent + ")",
                  indent + "if database_url_env and not reuses_existing_database_binding:",
                  indent + "    credential.require(\"database:admin\")",
              ]
              lines[lifecycle_index:lifecycle_index] = scope_gate
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          updated = path.read_text(encoding="utf-8")
          if marker not in updated:
              raise SystemExit("scope correction marker was not installed")
          if 'if database_url_env:\n            credential.require("database:admin")' in updated:
              raise SystemExit("legacy unconditional database:admin gate remains")
          if 'if database_url_env and not reuses_existing_database_binding:\n            credential.require("database:admin")' not in updated:
              raise SystemExit("guarded database:admin gate was not installed")
          PY

          python3 -m py_compile backend/app/services/workspace_deployments.py
          grep -n "reuses_existing_database_binding" backend/app/services/workspace_deployments.py

      - name: Commit the audited scope correction
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/app/services/workspace_deployments.py; then
            echo "scope correction already present"
            exit 0
          fi
          git config user.name "warehouse-release-bot"
          git config user.email "warehouse-release-bot@users.noreply.github.com"
          git add backend/app/services/workspace_deployments.py
          git commit -m "fix: allow unchanged managed database bindings during deploy"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "unable to push audited scope correction" >&2
          exit 1
