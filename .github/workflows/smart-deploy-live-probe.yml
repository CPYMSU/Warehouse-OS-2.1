name: Smart deploy live probe

on:
  pull_request:
    paths:
      - ".github/workflows/smart-deploy-live-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Verify Registry SSH over 443 and live MK7
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          key="/Users/peiyuan/Server/bonfirework/secrets/registry-readonly-ed25519"
          test -f "$key"
          test "$(stat -f '%Lp' "$key")" = "600"

          echo '=== GitHub SSH over 443 ==='
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND="ssh -i ${key} -o Hostname=ssh.github.com -p 443 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new"
          git ls-remote 'git@github.com:CPYMSU/registry.git' 'refs/heads/main'

          echo '=== current Smart Deploy log ==='
          tail -n 30 /Users/peiyuan/Server/bonfirework/logs/digital-asset-smart-deploy.error.log 2>/dev/null || true

          echo '=== public MK7 ==='
          for url in \
            'https://mk7-workspace.bonfirework.org/' \
            'https://bonfirework.org/assets/bonfire/mk7-workspace/'
          do
            body="$(mktemp)"
            code="$(curl -L -sS --connect-timeout 5 --max-time 20 -o "$body" -w '%{http_code}' "$url" || true)"
            echo "$url HTTP=$code bytes=$(wc -c < "$body" | tr -d ' ') slogan=$(grep -c '人民电力为人民' "$body" || true)"
            rm -f "$body"
          done
