name: Smart deploy live probe

on:
  pull_request:
    paths:
      - ".github/workflows/smart-deploy-live-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Provision a dedicated Registry read-only public key
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          secrets="/Users/peiyuan/Server/bonfirework/secrets"
          key="${secrets}/registry-readonly-ed25519-v2"
          mkdir -p "$secrets"
          chmod 700 "$secrets"
          umask 077
          if [ ! -f "$key" ]; then
            ssh-keygen -q -t ed25519 -N '' -C 'warehouse-registry-readonly-v2' -f "$key"
          fi
          chmod 600 "$key"
          chmod 644 "${key}.pub"
          echo '=== REGISTRY_PUBLIC_KEY ==='
          cat "${key}.pub"
          echo '=== REGISTRY_PUBLIC_KEY_FINGERPRINT ==='
          ssh-keygen -lf "${key}.pub" -E sha256
