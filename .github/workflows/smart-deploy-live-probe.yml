name: Smart deploy live probe

on:
  pull_request:
    paths:
      - ".github/workflows/smart-deploy-live-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Final verify depth-2 Smart Deploy and live MK7
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          root="/Users/peiyuan/Server/bonfirework"
          state="${root}/cache/digital-asset-smart-deploy/state.json"
          out="${root}/logs/digital-asset-smart-deploy.log"
          err="${root}/logs/digital-asset-smart-deploy.error.log"
          runtime="${root}/libexec/digital-asset-smart-deploy/smart-digital-asset-deploy.py"

          echo '=== installed fetch depth ==='
          grep -n 'DEFAULT_FETCH_DEPTH' "$runtime"

          echo '=== active processes ==='
          ps -ax -o pid=,etime=,command= | grep -E 'smart-digital-asset-deploy|publish-digital-assets|git (ls-remote|clone|fetch)|ssh .*github' | grep -v grep || true

          echo '=== Smart Deploy state ==='
          if [ -f "$state" ]; then
            cat "$state"
          else
            echo 'state file not created yet'
          fi
          echo '=== recent stdout ==='
          tail -n 80 "$out" 2>/dev/null || true
          echo '=== recent stderr ==='
          tail -n 80 "$err" 2>/dev/null || true

          echo '=== public MK7 ==='
          ok=0
          for url in \
            'https://mk7-workspace.bonfirework.org/' \
            'https://bonfirework.org/assets/bonfire/mk7-workspace/'
          do
            body="$(mktemp)"
            code="$(curl -L -sS --connect-timeout 5 --max-time 20 -o "$body" -w '%{http_code}' "$url" || true)"
            count="$(grep -c '人民电力为人民' "$body" || true)"
            echo "$url HTTP=$code bytes=$(wc -c < "$body" | tr -d ' ') slogan=$count"
            if [ "$count" -gt 0 ]; then
              echo "LIVE_SLOGAN_FOUND=$url"
              ok=1
            fi
            rm -f "$body"
          done
          test "$ok" -eq 1
