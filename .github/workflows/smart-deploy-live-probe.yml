name: Smart deploy live probe

on:
  pull_request:
    paths:
      - ".github/workflows/smart-deploy-live-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Identify Registry deploy-key binding over SSH 443
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          key="/Users/peiyuan/Server/bonfirework/secrets/registry-readonly-ed25519"
          test -f "$key"
          test "$(stat -f '%Lp' "$key")" = "600"

          echo '=== local key fingerprint ==='
          ssh-keygen -y -f "$key" | ssh-keygen -lf - -E sha256

          echo '=== GitHub authenticated identity over 443 ==='
          set +e
          identity="$(ssh -T -i "$key" -o Hostname=ssh.github.com -p 443 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new git@github.com 2>&1)"
          rc=$?
          set -e
          echo "ssh_rc=$rc"
          echo "$identity"

          echo '=== Registry read test over 443 ==='
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND="ssh -i ${key} -o Hostname=ssh.github.com -p 443 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new"
          set +e
          git ls-remote 'git@github.com:CPYMSU/registry.git' 'refs/heads/main'
          registry_rc=$?
          set -e
          echo "registry_rc=$registry_rc"

          echo '=== current Smart Deploy stderr ==='
          tail -n 20 /Users/peiyuan/Server/bonfirework/logs/digital-asset-smart-deploy.error.log 2>/dev/null || true
