name: Smart deploy live probe

on:
  pull_request:
    paths:
      - ".github/workflows/smart-deploy-live-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Final verify after publisher-core SSH 443 fix
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          root="/Users/peiyuan/Server/bonfirework"
          key="${root}/secrets/registry-readonly-ed25519-v2"
          state="${root}/cache/digital-asset-smart-deploy/state.json"
          out="${root}/logs/digital-asset-smart-deploy.log"
          err="${root}/logs/digital-asset-smart-deploy.error.log"
          smart_path="${root}/libexec/digital-asset-smart-deploy:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

          echo '=== launchd ==='
          launchctl print "gui/$(id -u)/org.bonfirework.digital-asset-smart-deploy" | sed -n '1,95p'
          echo '=== private ssh wrapper ==='
          PATH="$smart_path" command -v ssh
          sed -n '1,5p' "${root}/libexec/digital-asset-smart-deploy/ssh"

          echo '=== Registry auth over SSH 443 ==='
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND="ssh -i ${key} -o Hostname=ssh.github.com -p 443 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new"
          git ls-remote 'git@github.com:CPYMSU/registry.git' 'refs/heads/main'

          echo '=== Smart Deploy state ==='
          if [ -f "$state" ]; then
            cat "$state"
          else
            echo 'state file not created yet'
          fi
          echo '=== stdout ==='
          tail -n 120 "$out" 2>/dev/null || true
          echo '=== stderr ==='
          tail -n 120 "$err" 2>/dev/null || true

          echo '=== public MK7 ==='
          ok=0
          for url in \
            'https://mk7-workspace.bonfirework.org/' \
            'https://bonfirework.org/assets/bonfire/mk7-workspace/'
          do
            body="$(mktemp)"
            code="$(curl -L -sS --connect-timeout 5 --max-time 20 -o "$body" -w '%{http_code}' "$url" || true)"
            count="$(grep -c '人民电力为人民' "$body" || true)"
            echo "$url HTTP=$code bytes=$(wc -c < "$body" | tr -d ' ') slogan=$count"
            if [ "$count" -gt 0 ]; then
              echo "LIVE_SLOGAN_FOUND=$url"
              ok=1
            fi
            rm -f "$body"
          done
          test "$ok" -eq 1
