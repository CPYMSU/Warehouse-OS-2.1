name: Smart deploy live probe

on:
  pull_request:
    paths:
      - ".github/workflows/smart-deploy-live-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 5
    steps:
      - name: Inspect Smart Deploy process tree and publication state
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          root="/Users/peiyuan/Server/bonfirework"
          cache="${root}/cache/digital-asset-smart-deploy"
          checkout="${cache}/registry"
          state="${cache}/state.json"
          out="${root}/logs/digital-asset-smart-deploy.log"
          err="${root}/logs/digital-asset-smart-deploy.error.log"

          echo '=== process tree ==='
          ps -ax -o ppid=,pid=,state=,etime=,command= | grep -E 'smart-digital-asset-deploy|run-smart-digital-asset-deploy|dam.py|publish-digital-assets|git |ssh |curl ' | grep -v grep || true
          echo '=== watcher sockets ==='
          watcher_pid="$(pgrep -f 'smart-digital-asset-deploy.py --interval-seconds 3' | head -n 1 || true)"
          echo "watcher_pid=${watcher_pid}"
          if [ -n "$watcher_pid" ]; then
            lsof -nP -a -p "$watcher_pid" -i 2>/dev/null || true
          fi

          echo '=== Registry cache ==='
          if [ -d "${checkout}/.git" ]; then
            git -C "$checkout" rev-parse HEAD
            echo "lock_files=$(find "${checkout}/.git" -name '*.lock' | wc -l | tr -d ' ')"
          else
            echo 'Registry checkout not ready yet'
          fi

          echo '=== Smart Deploy state ==='
          if [ -f "$state" ]; then
            cat "$state"
          else
            echo 'state file not created yet'
          fi
          echo '=== recent stdout ==='
          tail -n 60 "$out" 2>/dev/null || true
          echo '=== recent stderr ==='
          tail -n 60 "$err" 2>/dev/null || true

          echo '=== public MK7 ==='
          ok=0
          for url in \
            'https://mk7-workspace.bonfirework.org/' \
            'https://bonfirework.org/assets/bonfire/mk7-workspace/'
          do
            body="$(mktemp)"
            code="$(curl -L -sS --connect-timeout 5 --max-time 20 -o "$body" -w '%{http_code}' "$url" || true)"
            count="$(grep -c '人民电力为人民' "$body" || true)"
            echo "$url HTTP=$code bytes=$(wc -c < "$body" | tr -d ' ') slogan=$count"
            if [ "$count" -gt 0 ]; then
              echo "LIVE_SLOGAN_FOUND=$url"
              ok=1
            fi
            rm -f "$body"
          done
          test "$ok" -eq 1
