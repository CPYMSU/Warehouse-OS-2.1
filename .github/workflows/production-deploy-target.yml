name: Production deploy target

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment containing this target's variables and secrets
        required: true
        type: string
      target:
        description: Stable deployment target identifier
        required: true
        type: string
      runs_on:
        description: JSON array of runner labels
        required: true
        type: string
      transport:
        description: Deploy locally on the runner or over restricted SSH
        required: true
        type: string
      verify_public:
        description: Verify bonfirework.org after the target becomes healthy
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Smart deploy ${{ inputs.target }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: https://bonfirework.org
    env:
      WAREHOUSE_DEPLOY_TARGET: ${{ inputs.target }}
      WAREHOUSE_DEPLOY_TRANSPORT: ${{ inputs.transport }}
      WAREHOUSE_DEPLOY_HOST: ${{ vars.WAREHOUSE_DEPLOY_HOST }}
      WAREHOUSE_DEPLOY_USER: ${{ vars.WAREHOUSE_DEPLOY_USER }}
      WAREHOUSE_REMOTE_DEPLOY_MANAGER: ${{ vars.WAREHOUSE_REMOTE_DEPLOY_MANAGER }}
      WAREHOUSE_DEPLOY_INCOMING: ${{ vars.WAREHOUSE_DEPLOY_INCOMING }}
      WAREHOUSE_DEPLOY_MANAGER_SUDO: ${{ vars.WAREHOUSE_DEPLOY_MANAGER_SUDO }}
      WAREHOUSE_DEPLOY_PREPARE_INCOMING: ${{ vars.WAREHOUSE_DEPLOY_PREPARE_INCOMING }}
      WAREHOUSE_DEPLOY_SCP_LEGACY: ${{ vars.WAREHOUSE_DEPLOY_SCP_LEGACY }}
      WAREHOUSE_REQUIRE_ACTIVE_MANIFEST: "1"
      WAREHOUSE_DEPLOY_LOCAL_VALIDATION: basic

    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the Mac mini toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_OS}" == macOS ]] || {
            echo "production deployments require the dedicated Mac runner" >&2
            exit 1
          }
          homebrew_bin=/opt/homebrew/bin
          [[ -x "${homebrew_bin}/python3" && -x "${homebrew_bin}/node" ]] || {
            echo "the Mac runner requires Homebrew Python and Node.js" >&2
            exit 1
          }
          export PATH="${homebrew_bin}:${PATH}"
          python3 -c 'import sys; assert (3, 12) <= sys.version_info < (3, 15), sys.version'
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
          echo "${homebrew_bin}" >> "${GITHUB_PATH}"

      - name: Install the restricted deployment identity
        if: inputs.transport == 'ssh'
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.WAREHOUSE_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.WAREHOUSE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${WAREHOUSE_DEPLOY_HOST:?production variable is required}"
          : "${WAREHOUSE_DEPLOY_USER:?production variable is required}"
          : "${WAREHOUSE_REMOTE_DEPLOY_MANAGER:?production variable is required}"
          : "${WAREHOUSE_DEPLOY_INCOMING:?production variable is required}"
          : "${DEPLOY_SSH_KEY:?production secret is required}"
          : "${DEPLOY_KNOWN_HOSTS:?production secret is required}"
          ssh_dir="${RUNNER_TEMP}/warehouse-ssh"
          deploy_identity="${ssh_dir}/id_ed25519"
          deploy_known_hosts="${ssh_dir}/known_hosts"
          install -d -m 0700 "${ssh_dir}"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${deploy_identity}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${deploy_known_hosts}"
          chmod 0600 "${deploy_identity}" "${deploy_known_hosts}"
          ssh-keygen -y -f "${deploy_identity}" >/dev/null
          echo "WAREHOUSE_DEPLOY_IDENTITY=${deploy_identity}" >> "${GITHUB_ENV}"
          echo "WAREHOUSE_DEPLOY_KNOWN_HOSTS=${deploy_known_hosts}" >> "${GITHUB_ENV}"

      - name: Plan against the target's active release
        id: plan
        shell: bash
        run: |
          set -Eeuo pipefail
          plan_json="${RUNNER_TEMP}/deploy-plan.json"
          ops/deploy plan > "${plan_json}"
          echo "deploy_required=$(jq -r '.deploy_required' "${plan_json}")" \
            >> "${GITHUB_OUTPUT}"
          {
            echo "### Smart deployment: ${{ inputs.target }}"
            jq -r '"- Runtime deployment required: `\(.deploy_required)`\n- Changed files: `\(.changed_count)`\n- Target risk: `\(.risk)`\n- Selected lane: `\(.mode)`"' \
              "${plan_json}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install packaging tools
        if: steps.plan.outputs.deploy_required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_OS}" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libdigest-sha-perl rsync
          fi
          tools_venv="${RUNNER_TEMP}/warehouse-deploy-tools"
          python3 -m venv "${tools_venv}"
          "${tools_venv}/bin/pip" install --disable-pip-version-check 'alembic>=1.14,<2'
          echo "WAREHOUSE_DEPLOY_ALEMBIC=${tools_venv}/bin/alembic" >> "${GITHUB_ENV}"

      - name: Execute the smart deployment
        if: steps.plan.outputs.deploy_required == 'true'
        shell: bash
        run: ops/deploy smart

      - name: Verify target health
        if: steps.plan.outputs.deploy_required == 'true'
        shell: bash
        run: ops/deploy status

      - name: Verify the public primary endpoint
        if: steps.plan.outputs.deploy_required == 'true' && inputs.verify_public
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 15 \
            https://bonfirework.org/api/health

      - name: Record a target no-op
        if: steps.plan.outputs.deploy_required == 'false'
        run: echo "${{ inputs.target }} already matches this runtime tree."

      - name: Remove the temporary deployment identity
        if: always() && inputs.transport == 'ssh'
        shell: bash
        run: |
          rm -f \
            "${RUNNER_TEMP}/warehouse-ssh/id_ed25519" \
            "${RUNNER_TEMP}/warehouse-ssh/known_hosts"
          rmdir "${RUNNER_TEMP}/warehouse-ssh" 2>/dev/null || true
