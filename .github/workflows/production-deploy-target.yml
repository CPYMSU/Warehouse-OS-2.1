name: Production deploy target

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      target:
        required: true
        type: string
      runs_on:
        description: JSON runner labels consumed by fromJSON
        required: true
        type: string
      transport:
        description: local for the Mac runner, ssh for a remote target
        required: true
        type: string
      verify_public:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Smart deploy ${{ inputs.target }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: https://bonfirework.org
    env:
      WAREHOUSE_DEPLOY_TARGET: ${{ inputs.target }}
      WAREHOUSE_DEPLOY_TRANSPORT: ${{ inputs.transport }}
      WAREHOUSE_DEPLOY_HOST: ${{ vars.WAREHOUSE_DEPLOY_HOST }}
      WAREHOUSE_DEPLOY_USER: ${{ vars.WAREHOUSE_DEPLOY_USER }}
      WAREHOUSE_REMOTE_DEPLOY_MANAGER: ${{ vars.WAREHOUSE_REMOTE_DEPLOY_MANAGER }}
      WAREHOUSE_DEPLOY_INCOMING: ${{ vars.WAREHOUSE_DEPLOY_INCOMING }}
      WAREHOUSE_DEPLOY_MANAGER_SUDO: ${{ vars.WAREHOUSE_DEPLOY_MANAGER_SUDO }}
      WAREHOUSE_DEPLOY_PREPARE_INCOMING: ${{ vars.WAREHOUSE_DEPLOY_PREPARE_INCOMING }}
      WAREHOUSE_DEPLOY_SCP_LEGACY: ${{ vars.WAREHOUSE_DEPLOY_SCP_LEGACY }}
      WAREHOUSE_DEPLOY_IDENTITY: ${{ github.workspace }}/.warehouse-ssh/id_ed25519
      WAREHOUSE_REQUIRE_ACTIVE_MANIFEST: "1"
      WAREHOUSE_DEPLOY_LOCAL_VALIDATION: basic

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the native Mac toolchain
        if: inputs.transport == 'local'
        shell: bash
        run: |
          set -Eeuo pipefail
          homebrew_bin=/opt/homebrew/bin
          echo "${homebrew_bin}" >> "${GITHUB_PATH}"
          "${homebrew_bin}/python3" -m venv backend/.venv
          backend/.venv/bin/pip install --disable-pip-version-check 'alembic>=1.14,<2'

      - name: Prepare the hosted runner toolchain
        if: inputs.transport == 'ssh'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv backend/.venv
          backend/.venv/bin/pip install --disable-pip-version-check 'alembic>=1.14,<2'

      - name: Install the restricted SSH deployment identity
        if: inputs.transport == 'ssh'
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.WAREHOUSE_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.WAREHOUSE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${WAREHOUSE_DEPLOY_HOST:?production variable is required}"
          : "${WAREHOUSE_DEPLOY_USER:?production variable is required}"
          : "${DEPLOY_SSH_KEY:?production secret is required}"
          : "${DEPLOY_KNOWN_HOSTS:?production secret is required}"
          install -d -m 0700 "${WAREHOUSE_DEPLOY_IDENTITY%/*}" "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${WAREHOUSE_DEPLOY_IDENTITY}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${WAREHOUSE_DEPLOY_IDENTITY}" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${WAREHOUSE_DEPLOY_IDENTITY}" >/dev/null

      - name: Plan against the target's active release
        id: plan
        shell: bash
        run: |
          set -Eeuo pipefail
          plan_json="${RUNNER_TEMP}/deploy-plan.json"
          ops/deploy plan > "${plan_json}"
          echo "deploy_required=$(jq -r '.deploy_required' "${plan_json}")" \
            >> "${GITHUB_OUTPUT}"
          jq -r '"- Target: `${{ inputs.target }}`\n- Runtime deployment required: `\(.deploy_required)`\n- Changed files: `\(.changed_count)`\n- Risk: `\(.risk)`\n- Lane: `\(.mode)`"' \
            "${plan_json}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Execute the smart deployment
        if: steps.plan.outputs.deploy_required == 'true'
        shell: bash
        run: ops/deploy smart

      - name: Verify target health
        if: steps.plan.outputs.deploy_required == 'true'
        shell: bash
        run: ops/deploy status

      - name: Verify the public primary endpoint
        if: steps.plan.outputs.deploy_required == 'true' && inputs.verify_public
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 15 \
            https://bonfirework.org/api/health

      - name: Record a target no-op
        if: steps.plan.outputs.deploy_required == 'false'
        run: echo "${{ inputs.target }} already matches this runtime tree."
