name: Publish verified MK7 rescue media repair
on:
  push:
    branches: [chatgpt/repair-mk7-rescue-images]
    paths:
      - .github/workflows/mk7-rescue-media-publish.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warehouse-digital-asset-mk7-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 50
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        env:
          HTTPS_PROXY: http://127.0.0.1:7897
          HTTP_PROXY: http://127.0.0.1:7897
        with:
          fetch-depth: 1
      - name: Fetch only the immutable MK7 source into an isolated partial checkout
        run: python3 ops/macos/recover-rescue-media-release.py prepare
      - name: Accept and activate the repaired source without altering runtime permissions
        shell: bash
        run: |
          set -euo pipefail
          label="gui/$(id -u)/org.bonfirework.digital-asset-smart-deploy"
          plist="$HOME/Library/LaunchAgents/org.bonfirework.digital-asset-smart-deploy.plist"
          was_running=0
          if launchctl print "$label" >/dev/null 2>&1; then
            test -f "$plist"
            was_running=1
            launchctl bootout "$label"
          fi
          restore_watcher() {
            if [ "$was_running" = 1 ]; then
              if launchctl bootstrap "gui/$(id -u)" "$plist"; then
                echo WATCHER_RESTORE_OK=1
              else
                echo WATCHER_RESTORE_OK=0
                return 1
              fi
            else
              echo WATCHER_STATE_PRESERVED=1
            fi
          }
          trap restore_watcher EXIT
          python3 ops/macos/recover-rescue-media-release.py publish
      - name: Check every original image hash on both public entry routes
        run: python3 ops/macos/recover-rescue-media-release.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mk7-rescue-repaired-release
          path: ${{ runner.temp }}/rescue-recovery-${{ github.run_id }}/evidence/*.json
          retention-days: 14
  browser:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mk7-rescue-repaired-release
          path: evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated browser tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify desktop and mobile images, including hidden gallery images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('evidence');bundle=json.loads((out/'media-bundle.json').read_text())
          units=sorted({a['path'].split('/assets/approved/')[0].removeprefix('site/')+'/' for a in bundle['assets']})
          base='https://mk7-workspace.bonfirework.org/'
          report={'unit_count':len(units),'cases':[],'decoded_images':[]}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for mode,viewport in [('desktop',{'width':1440,'height':1000}),('mobile',{'width':390,'height':844})]:
                  context=browser.new_context(viewport=viewport)
                  for n,unit in enumerate(units):
                      page=context.new_page();errors=[]
                      page.on('pageerror',lambda error:errors.append(str(error)))
                      response=page.goto(base+unit,wait_until='domcontentloaded',timeout=90000)
                      page.wait_for_timeout(2500)
                      page.evaluate('''async () => {for (const image of document.images) {image.loading='eager'; if(image.src) {try {await image.decode()}catch(e){}}}}''')
                      missing=page.evaluate('''() => Array.from(document.images).filter(x=>x.getAttribute('src') && (!x.complete || x.naturalWidth===0)).map(x=>({src:x.currentSrc||x.src,alt:x.alt}))''')
                      case={'mode':mode,'unit':unit,'status':response.status,'broken_images':missing,'script_errors':errors,'images':page.locator('img[src]').count()}
                      page.screenshot(path=str(out/f'{mode}-{n+1}.png'),full_page=False)
                      opener=page.locator('button[data-open-image]')
                      if opener.count():
                          opener.first.click();page.wait_for_timeout(500)
                          case['enlarged_broken']=page.evaluate('''() => Array.from(document.querySelectorAll('dialog[open] img')).filter(x=>x.src&&(!x.complete||x.naturalWidth===0)).map(x=>x.src)''')
                          page.screenshot(path=str(out/f'{mode}-{n+1}-enlarged.png'),full_page=False)
                          page.keyboard.press('Escape')
                      report['cases'].append(case);page.close()
                  context.close()
              context=browser.new_context();page=context.new_page();page.goto(base+units[-1],wait_until='domcontentloaded',timeout=90000)
              refs=[base+a['path'].removeprefix('site/')+'?v='+a['sha256'][:16] for a in bundle['assets']]
              report['decoded_images']=page.evaluate('''async urls => {const result=[];for(let start=0;start<urls.length;start+=4){result.push(...await Promise.all(urls.slice(start,start+4).map(src=>new Promise(resolve=>{const image=new Image();const timer=setTimeout(()=>resolve({src,ok:false,error:'timeout'}),30000);image.onload=()=>{clearTimeout(timer);resolve({src,ok:image.naturalWidth>0,width:image.naturalWidth,height:image.naturalHeight})};image.onerror=()=>{clearTimeout(timer);resolve({src,ok:false,error:'decode failure'})};image.src=src}))))}return result}''',refs)
              browser.close()
          report['ok']=all(c['status']==200 and not c['broken_images'] and not c['script_errors'] and not c.get('enlarged_broken') for c in report['cases']) and all(i['ok'] for i in report['decoded_images'])
          (out/'browser-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({'ok':report['ok'],'course_units':len(units),'desktop_mobile_cases':len(report['cases']),'decoded_images':sum(i['ok'] for i in report['decoded_images'])}))
          assert report['ok'],'Rescue course browser image check failed'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mk7-rescue-browser-verification
          path: evidence
          retention-days: 14
