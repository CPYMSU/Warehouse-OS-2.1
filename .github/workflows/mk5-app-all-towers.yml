name: MK5 app all-towers workbench
on:
  push:
    branches: [mk5-appdev-all-towers-v1]
    paths: [.github/workflows/mk5-app-all-towers.yml]
permissions:
  contents: read
concurrency:
  group: mk5-appdev-all-towers-v1
  cancel-in-progress: false
jobs:
  app:
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 30
    env:
      MK5_APP_SOURCE_COMMIT: 75f4a3ffad8bd04c5c8f6d64efe0826bc8e59416
      MK5_APP_OPERATION: inventory
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        env:
          HTTPS_PROXY: http://127.0.0.1:7897
          HTTP_PROXY: http://127.0.0.1:7897
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: ops/mk5-source-sync
          fetch-depth: 1
      - name: Fetch pinned private application code only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$MK5_APP_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          code_dir="$(mktemp -d "$RUNNER_TEMP/mk5-app-code.XXXXXX")"
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND="ssh -i $HOME/Server/bonfirework/secrets/registry-readonly-ed25519-v2 -o Hostname=ssh.github.com -p 443 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes"
          git -C "$code_dir" init --quiet
          git -C "$code_dir" remote add origin git@github.com:CPYMSU/registry.git
          git -C "$code_dir" fetch --quiet --depth=1 origin "$MK5_APP_SOURCE_COMMIT"
          test "$(git -C "$code_dir" rev-parse FETCH_HEAD)" = "$MK5_APP_SOURCE_COMMIT"
          git -C "$code_dir" checkout --quiet --detach FETCH_HEAD
          echo "MK5_APP_CODE_DIR=$code_dir" >> "$GITHUB_ENV"
      - name: Run app-only online workbench
        run: python3 "$MK5_APP_CODE_DIR/03_应用源码/开发工具/scripts/online_app_workbench.py" "$MK5_APP_OPERATION"
