name: Digital asset controlled MK7 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/digital-asset-smart-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-digital-asset-smart-control
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 130
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: http.version
      GIT_CONFIG_VALUE_0: HTTP/1.1
      WAREHOUSE_BASE_URL: https://bonfirework.org
      WAREHOUSE_ASSET_REGISTRY_REPOSITORY: CPYMSU/registry
      WAREHOUSE_ASSET_REGISTRY_REF: main
      WAREHOUSE_ASSET_REGISTRY_PATH: registry.json
      WAREHOUSE_ASSET_WORKSPACE_KEYS_FILE: /Users/peiyuan/Server/bonfirework/secrets/digital-asset-workspace-keys.json
      WAREHOUSE_ASSET_REGISTRY_SSH_KEY: /Users/peiyuan/Server/bonfirework/secrets/registry-readonly-ed25519-v2
      WAREHOUSE_ASSET_SMART_CACHE_ROOT: /Users/peiyuan/Server/bonfirework/cache/digital-asset-smart-deploy
      WAREHOUSE_ASSET_SMART_STATE_PATH: /Users/peiyuan/Server/bonfirework/cache/digital-asset-smart-deploy/state.json
    steps:
      - uses: actions/checkout@v4
        env:
          HTTPS_PROXY: http://127.0.0.1:7897
          HTTP_PROXY: http://127.0.0.1:7897
        with:
          fetch-depth: 1

      - name: Normalize subdirectory source archive timestamps
        run: |
          set -euo pipefail
          python3 ops/macos/normalize-digital-asset-archive.py ops/macos/publish-digital-assets.py
          grep -n -- "--mtime=@0" ops/macos/publish-digital-assets.py

      - name: Publish MK7 through one controlled channel
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          restore_watcher() {
            python3 ops/macos/normalize-digital-asset-archive.py ops/macos/publish-digital-assets.py || true
            bash ops/macos/install-smart-digital-asset-deploy install || true
          }
          trap restore_watcher EXIT
          bash ops/macos/install-smart-digital-asset-deploy uninstall
          sleep 3
          for attempt in 1 2 3 4; do
            echo "controlled publish attempt ${attempt}"
            if bash ops/macos/install-smart-digital-asset-deploy force-all; then
              echo "controlled MK7 publish completed"
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "controlled MK7 publish exhausted retries" >&2
          exit 1
