name: Digital asset controlled MK7 release
# One guarded content-only release for the reviewed MK7 spacer safety course.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/digital-asset-smart-deploy.yml"
      - "ops/macos/normalize-digital-asset-archive.py"
      - "ops/macos/prepare-resilient-digital-asset-cli.py"
      - "ops/macos/publish-content-only-mk7.py"
      - "ops/macos/select-admin-workspace-key.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-digital-asset-mk7-publish
  cancel-in-progress: true

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64, warehouse-production]
    timeout-minutes: 180
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: http.version
      GIT_CONFIG_VALUE_0: HTTP/1.1
      WAREHOUSE_BASE_URL: https://bonfirework.org
      WAREHOUSE_ASSET_SMART_CACHE_ROOT: /Users/peiyuan/Server/bonfirework/cache/digital-asset-smart-deploy
    steps:
      - uses: actions/checkout@v4
        env:
          HTTPS_PROXY: http://127.0.0.1:7897
          HTTP_PROXY: http://127.0.0.1:7897
        with:
          fetch-depth: 1

      - name: Normalize subdirectory source archive timestamps
        run: |
          set -euo pipefail
          python3 ops/macos/normalize-digital-asset-archive.py ops/macos/publish-digital-assets.py
          grep -n -- "--mtime=1970-01-01T00:00:00Z" ops/macos/publish-digital-assets.py

      - name: Reuse the governed production API component
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("ops/macos/publish-content-only-mk7.py")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(runtime_type="auto",\n\s*)component="",(\n\s*\)\n\s*state = publisher\._wait_for_release)'
          )
          updated, count = pattern.subn(
              r'\1component="api",\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"content release component call match count={count}")
          path.write_text(updated, encoding="utf-8")
          PY
          grep -n 'component="api"' ops/macos/publish-content-only-mk7.py
          python3 -m py_compile ops/macos/publish-content-only-mk7.py

      - name: Build, accept, activate and verify the MK7 content release
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

          release_dir="${RUNNER_TEMP}/mk7-content-release"
          selected_keys="${release_dir}/workspace-keys.json"
          source_keys="/Users/peiyuan/Server/bonfirework/secrets/digital-asset-workspace-keys.json"
          install -d -m 0700 "${release_dir}"

          restore_watcher() {
            python3 ops/macos/normalize-digital-asset-archive.py ops/macos/publish-digital-assets.py || true
            bash ops/macos/install-smart-digital-asset-deploy install || true
          }
          cleanup() {
            rm -f "${selected_keys}"
            restore_watcher
          }
          trap cleanup EXIT

          python3 ops/macos/select-admin-workspace-key.py \
            --source "${source_keys}" \
            --target-alias mk7 \
            --output "${selected_keys}" \
            --base-url "${WAREHOUSE_BASE_URL}"

          bash ops/macos/install-smart-digital-asset-deploy uninstall
          sleep 3
          python3 ops/macos/publish-content-only-mk7.py \
            --ref chatgpt/mk7-content-v231 \
            --workspace-alias mk7 \
            --workspace-keys "${selected_keys}" \
            --timeout-seconds 7200
