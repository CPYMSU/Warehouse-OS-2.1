[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-os-api"
version = "0.1.0"
description = "PostgreSQL-first API foundation for Warehouse OS 2.1"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=49,<50",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "webauthn>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
bonfire-research = "app.research_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"app/api/compat.py" = ["E501"]
"app/api/full_stack_identity.py" = ["E501", "F401", "I001", "UP035", "UP045"]
"app/api/full_stack_business.py" = ["E501", "F401", "I001", "UP035", "UP045"]
"app/api/hosted_runtime_gateway.py" = ["E501"]
"app/api/intelligent_hosting_compat.py" = ["E501"]
"app/api/workspace_autonomy.py" = ["E501"]
"app/api/workspace_v1_compat.py" = ["E501"]
"app/runtime_controller.py" = ["E501"]
"app/services/workspace_autonomy.py" = ["E501"]
"tests/test_full_stack_connections.py" = ["E501"]
"tests/test_workspace_hosting_compat.py" = ["E501"]
"app/templates/industry_blueprints.py" = ["E501", "I001", "UP035", "UP045"]
"app/terminal/legacy_catalog.py" = ["E501", "I001", "UP031", "UP035", "UP045"]

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.db", "app.services", "app.templates", "app.terminal"]
